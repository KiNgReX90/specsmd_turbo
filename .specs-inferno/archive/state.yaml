  - id: integrate-checks-what-a-base-commit-changed-and-lands-beside-busy-siblings-verify-item-waits-only-on-overlap-and-a-run-branch-keeps-its-config
    title: "Integrate checks what a base commit changed and lands beside busy siblings, verify-item waits only on overlap, and a run branch keeps its config"
    status: completed
    completed_at: 2026-11-11T10:48:01Z
    created: 2026-11-09
    base_branch: main
    depends_on_intents: []
    tester_cases: []
    comment: |
      SOURCE. Items 7 to 11 of Skoft_CRA docs/clean-code/tooling.md (lines 16-21), decided by the clean-code lead on 2026-11-09 as one flow intent, reinstalled later on the lead's go.
      INTENT. (a) five runner defects across integrate's diff anchor, its dirty refusal and its ledger commit, verify-item's attribution and the run config record; (d) the attribution and the config record own disjoint files and build beside the integrate chain.
      MEASURED at 2205834 by evidence/runner-defects.sh. A commit on main prints SKIP for its scoped check and exits 0, and with doubles exits 2 BAD_CONFIG; a pending review file outside every scope exits 2 DIRTY; ownedBy of a collapsed untracked dir is false; a bare integrate after a --config one runs the repo config. Three attribution cases assert the wait on a disjoint dispatch. completeItem also rewrites the work-item file, so the ledger commit stages it beside state.yaml.
      DECISIONS. Integrate inherits the lanes-only since rule of 97e34e7 and runs every scoped check when nothing gives a diff; it refuses only dirt inside the scopes of the checks it runs, the items' own files and the ledger files; the gate keeps its whole-tree refusal; an unexplained change beside a disjoint open dispatch waits for it; the run config lives in cacheDir/<branch>/run-config.json for intent run branches only, read by worktree, integrate, gate, green, ship and the lane accepts; no flow-side reservation refusal.
      CHAIN. The dirt item follows the anchor item and the ledger item; attribution and the config record start at once; run-integrate.cjs and run.cjs overlaps serialize in the orchestrator. Every edit sits in the orchestrate scripts dir, no agent or skill text.
      INSTALLED COPY. None in this repo; the drift test installs into a sandbox. TESTER. None. LOOK. None.
      STOPPED. The run was stopped on the owner's order on 2026-11-10, and its claim was released with unclaim-intent. The three open items were finished by hand on the inferno-improvement branch, outside the runner: the base item's correction in d135d299 and ca64da08, the config item's correction in 4446e8b2, and the fifth item in 182cbc12 with its tests in 4e2ad0e7. Each was checked with its tests and with line breaks that turned a test red, and the two corrections were re-read cold, but none of those reviews went through the runner. The item states below are the runner's last record: two items completed, the base item and the config item pending with review fix, and the fifth item pending with no review. The human step that remains: on a machine that can integrate this intent, record a review of each open item with run.cjs review --item, land each with run.cjs integrate --item, then run close-intent and archive-intent.
      FINISHED. On 2026-11-11 the runner reviewed the three open items on this branch, each on both lenses. The base item took one correction of two minor findings and settled. The config item went to a fresh escalate builder, for a record that could not be read, and came back clean. The fifth item took two corrections, the second decided by the oracle, and came back clean with both its mutants caught. Each landed with integrate, so every item below reads completed. The intent was then closed and archived with no intent scan, no intent review and no gate run, because its gate command belongs to another machine. In their place the whole flow script suite and the other tests of the package ran on this branch: all green except twelve Codex wait tests, which fail on the Codex version of the machine that ran them.
