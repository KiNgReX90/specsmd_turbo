    comment: |
      SOURCE. Gate-speed council statement 2 of 2026-11-06, plan item 2 a to h and amendments 1, 3 and 4, copied to council/ in the intent dir.
      INTENT. (a) eight mechanisms across the gate, the lanes, the proofs, the review, ship and the agent texts; (e) the flow runs from Skoft_CRA's primary checkout the moment it is installed, so only the full suite may let it out.
      MEASURED on 7c4d721. Installed scripts byte-identical; the nine gate and lane suites pass 126 of 126; three Skoft_CRA gate results name flake, each matching one proof by command, branch and seconds, none in Skoft_Files; Skoft_Files sets none of the new keys and no Windows lane; budget 4887 of 5000 orchestrator and 4474 of 4500 planner on Skoft_CRA.
      DECISIONS. Every behaviour behind merge_slot, review.outside or a lane's accept_check, stop or red_line; INFERNO_GATE_CONFIG and INFERNO_LANE_LOG instead of the DF names Skoft_CRA's lane intent pinned; supersede asks the host's stop command; --since added to gate --lanes-only; the queue in the git common dir; flake 96eec9d0a reversed on the council's point 6.
      CHAIN. Flake, kb review, lane keys and slot store start in parallel; early red after the lane keys; the gate wiring after all four; then the direct driver commands, supersede and the texts, serialized on run.cjs and run-gate.cjs.
      DEPENDS. None in this ledger. Skoft_CRA's lane intent builds the host halves against this interface; whichever lands second sets accept_check and stop in Skoft_CRA's configs.
      AFTER SHIP. The reinstall recipe in the brief installs the flow into Skoft_CRA in the shape of d81f2307e and turns merge_slot, review.outside and red_line on; the high-contrast intent shipped as bd1a6a318.
      APPENDED. gs-ship-runs-the-host-cleanup-once-the-worktree-is-gone runs the host's optional verification.ship_cleanup last in removeWorktree, from the primary with INFERNO_BRANCH and INFERNO_TREE, after the slot item on run-ship.cjs; the texts item documents the key in config.example.yaml.
      TESTER. None. LOOK. None.
