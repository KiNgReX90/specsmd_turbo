item: ri-integrate-refuses-only-the-dirt-it-reads-or-commits
verdict: fix
files:
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-integrate.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-dirt.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-gate.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-review.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-integrate.test.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-integrate-beside.test.cjs
findings:
  - criterion: "1, a fold the sibling's file blocks names that file, never conflict folding with an empty list"
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-dirt.cjs
    line: 67
    evidence: "foldBlockers keeps only the dirty files that `git diff HEAD...<ref>` lists. git refuses a real (not fast-forward) merge over any staged change, whether the incoming commits touch it or not: in a throwaway repo with one unrelated file y staged and a local commit the other side lacks, `git merge --no-edit other` exited 2 with 'Your local changes to the following files would be overwritten by merge: y' while neither side's commits touch y. foldBlockers then returns [], refuseDirt at run-gate.cjs:73 returns without throwing, and run-gate.cjs:76-80 throws FOLD_CONFLICT 'conflict folding <ref> into <branch>: . Resolve them...', the empty list this item replaces. Before this item integrate refused that staged sibling file up front through refuseDirty; the narrowed pre-fold refusal now tolerates it, so a sibling caught between its git add and its git commit turns the landing's fold into an empty conflict list. The beside suite covers unstaged and untracked blockers only (run-integrate-beside.test.cjs:253-280)."
    fix: "In foldBlockers also return every staged file (`git diff --cached --name-only --no-renames -z HEAD`) beside the dirty files the incoming commits change, since a staged file blocks any real merge. Add a case to run-integrate-beside.test.cjs on origin.repo(): a local commit origin lacks, origin/main moving docs/b.md, and an unrelated src/b.ts edited and staged with git add; integrate --tree <root> exits 2 with DIRTY naming src/b.ts and never prints conflict folding."
    severity: minor
  - criterion: "item step 2, the selection reads committed paths only, so a tolerated sibling file never selects a check (the browser step counts as an unscoped check)"
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-integrate.cjs
    line: 119
    evidence: "e2eSelection builds `changed` from impact.changedSince (run-e2e-impact.cjs:116-134), which adds `git diff --name-only HEAD` and every untracked file to the committed paths. Before this item integrate refused any dirt first, so that list held committed paths only; now a tolerated sibling file reaches it. An uncommitted sibling file a map entry or full_when covers, or a sibling's new spec file, makes selection.command non-null, checksRead at :224 then counts the browser step as an unscoped reader, and :225 refuses the very sibling file that selected it, on a landing whose committed change maps to no spec. The comment at :215-216 says a sibling's uncommitted file never selects a check. No test covers it: the browser case (run-integrate-beside.test.cjs:218-233) has a-one own a spec, so the step runs regardless."
    fix: "In e2eSelection select from committed paths only: pass checkAndLand's `since` in and drop from impact.changedSince's list each file dirt.dirtyFiles(tree) lists that `git diff --name-only --no-renames <since> HEAD` does not. Add a case to run-integrate-beside.test.cjs: an integrate_e2e section whose map sends docs/** to a spec, a-one owning and committing only src/a.ts, an untracked docs/sibling.md; integrate --item a-one exits 0, prints SKIP e2e, and docs/sibling.md stays uncommitted."
    severity: minor
  - criterion: "integrate puts a killed mutate's leftover back first, and every way out says so, a refusal included (run-integrate.cjs:157-158)"
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-integrate.cjs
    line: 168
    evidence: "integrate now calls lib.readConfig (:168) and landingFiles (:169, which calls lib.readItemSpec at :139) before recoverInterrupted (:171) and outside the try that adds afterRecovery. readConfig throws BAD_CONFIG for a --config that does not exist (run-lib.cjs:183) or that fails validation (run-lib.cjs:204-208); readItemSpec throws SPEC_MISSING or an ownership refusal (run-item-spec.cjs:65-76). Before this item refuseDirty restored first and checkAndLand read the config inside the try, so such a refusal carried the restored lines; now it leaves a dead mutant in the source and says nothing about it. run-review-recover.test.cjs:53-60 covers green, red and owed-review integrates only."
    fix: "Wrap :168-170 so a RunError there first runs recoverInterrupted(tree, { keepLive: () => true }), which puts back a dead mutant and leaves a live one, and rethrows with afterRecovery(restored, error.message). Add a case to run-integrate-beside.test.cjs: killedMutate on src/a.ts, then integrate --config missing.yaml exits 2 with BAD_CONFIG, prints 'restored src/a.ts from an interrupted mutate', and src/a.ts holds its committed bytes."
    severity: minor
