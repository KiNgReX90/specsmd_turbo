item: ri-the-ledger-commit-stages-only-what-completion-wrote
verdict: fix
files:
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-integrate.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-integrate-ledger.test.cjs
findings:
  - criterion: "a file staged beside an integrate is not swept into the ledger commit"
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-integrate.cjs
    line: 61
    evidence: |
      No case reaches a completion that writes nothing, and two lines of the diff rest on it. Mutants run in a clean scratch worktree at c745505d on Beta, with run-integrate-ledger, run-integrate and run-integrate-review (plus run-review-recover for the second):
      - run-integrate.cjs:61, `['diff', '--cached', '--name-only', '--', ...paths]` made `['diff', '--cached', '--name-only']`: 27 pass, 0 fail.
      - run-integrate.cjs:82, `if (result.markdown) written.push(result.markdown);` made `written.push(result.markdown);`: 42 pass, 0 fail.
      The case is reachable: owedReviews passes a completed item whose clean review is current (run-review.cjs:308-324), and completeItem then returns `already completed` with no markdown (state-transition.cjs:136-138). Without the guard at :82, path.join(tree, undefined) throws and the re-run crashes. Without the narrowed check at :61, a file a sibling staged makes the check non-empty, and `git commit -- .specs-inferno/state.yaml` over an unchanged path exits 1 with `nothing added to commit` (probed with plain git), so integrate fails beside the staged file this item exists to tolerate.
    fix: |
      Add a fourth case to run-integrate-ledger.test.cjs, "an item integrated again beside a staged file commits nothing and leaves it staged". Use landing() with a command that writes and `git add`s HALT only when `.specs-inferno/state.yaml` already contains `integrated_sha`, so the first `integrate --item a-one` completes the item on a clean tree and the second meets the staged file. Run integrate twice and record HEAD after the first. Assert the second exits 0, HEAD is unchanged, and `git diff --cached --name-only` still lists HALT. Both mutants above then fail it.
    severity: minor
  - criterion: "its review step then records it"
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-integrate-ledger.test.cjs
    line: 57
    evidence: |
      The criterion says the committed file ends with the `tree:`, `commit:` and `reviewer: rev-2` lines. The case reads the working-tree file with fs.readFileSync at :57, so it never checks the commit. Mutant in the scratch worktree on Beta: run-review.cjs:225, record's `lib.git(tree, ['commit', ...])` guarded by `if (item.id !== 'a-two')`, so a-two's record never commits. `node --test --test-name-pattern="its review step then records it"` still printed 1 pass, 0 fail.
    fix: |
      At :57 read the committed text, `git(fixture.root, ["show", `HEAD:${REVIEW}`]).split("\n")`, instead of the working-tree file. Then assert `git(fixture.root, ["status", "--porcelain", "--", REVIEW])` is empty, so the case fails when the record leaves the file uncommitted.
    severity: minor
