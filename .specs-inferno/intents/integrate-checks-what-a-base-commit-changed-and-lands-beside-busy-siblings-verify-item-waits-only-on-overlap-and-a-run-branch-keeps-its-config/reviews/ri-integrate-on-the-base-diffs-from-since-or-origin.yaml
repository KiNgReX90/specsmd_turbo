    caught: yes
  - criterion: "1: doubles on the base counts HEAD against the landing"
    test: "remote-run.sh auto /home/ruben/dev/specsmd_new-scratch-rbase node --test --test-name-pattern='doubles on the base counts HEAD' src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-integrate-base.test.cjs (run-integrate.cjs:180 passes no since to checkDoubles)"
