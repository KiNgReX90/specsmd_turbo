findings:
  - id: Q3
    check: correctness
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-integrate.cjs
    line: 122
    evidence: "Read e2eSelection at 118-124 and its caller at 238. The selection's own window is impact.sinceRef: off the base it returns the anchor, so changedSince takes every path the intent committed since merge-base(base, HEAD); on the base it returns the latest integrated_sha proof (run-e2e-impact.cjs 136-152, 116-134). The new filter keeps a dirty path only when it is in a different window, from..HEAD, where from is checkAndLand's since: the --since commit when one is named, origin/<base> on the base, or the merge base, which is HEAD on the base when landing.all is set (run-since.cjs 39-45). So a browser-facing path the intent committed inside the selection window but before from (an item committed before --since, or on the base after the last proof but already pushed, or every committed path in the landing.all case) is selected while clean and silently dropped once a sibling has the same file dirty: the browser step reports SKIP for a committed change instead of running it or refusing the dirty file, which is what happened before this range. The comment at 119-120 says committed paths still select. No test covers a committed and dirty path outside from..HEAD."
    fix: "Decide committed from the same window the selection reads, not from checkAndLand's since. In run-e2e-impact.cjs split changedSince into its committed part (the committedPaths result it already computes) and the working plus untracked part, export the committed part as committedSince(tree, since), and in e2eSelection keep a dirty path only when committedSince(tree, since) holds it; then drop the from parameter and its argument at 238. Add a case to run-integrate-beside.test.cjs: an item commits a mapped path, integrate runs with --since naming a later commit, a sibling leaves that path dirty, and the result is the DIRTY refusal (or the browser step selected), never SKIP e2e."
    severity: major
