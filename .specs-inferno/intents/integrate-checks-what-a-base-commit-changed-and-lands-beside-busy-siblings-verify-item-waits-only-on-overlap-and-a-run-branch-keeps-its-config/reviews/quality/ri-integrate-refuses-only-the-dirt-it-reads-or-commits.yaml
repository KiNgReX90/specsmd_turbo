item: ri-integrate-refuses-only-the-dirt-it-reads-or-commits
verdict: fix
files:
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-integrate.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-dirt.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-gate.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-review.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-integrate.test.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-integrate-beside.test.cjs
findings:
  - id: Q1
    check: errors
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-integrate.cjs
    line: 168
    evidence: "Read integrate at 166-181. Before this change the first statement after treeOf was gate.refuseDirty, which ran recoverInterrupted, and readConfig ran inside the try in checkAndLand, so every refusal carried afterRecovery, as the docstring at 157-158 still promises (\"every way out says so, a refusal included\"). Now lib.readConfig(tree, options.config) (168) and landingFiles (169, which calls lib.readItemSpec) run before recoverInterrupted (171) and outside the try. readConfig throws BAD_CONFIG for a --config path that does not exist and parseYaml throws on a broken file (run-lib.cjs readConfig); readItemSpec throws SPEC_MISSING for a ledger item with no work-item file (run-item-spec.cjs:65-67). On each of those paths a killed mutate's leftover stays in the source file and the refusal does not say so. No test covers it."
    fix: "Read the config and the landing files inside a guard that still restores first: wrap lines 168-170 in a try, and on a RunError call recoverInterrupted(tree) with no keepLive (so a live mutant holds the landing as it did before this change), then rethrow with error.message = afterRecovery(restored, error.message). Or move the readConfig and landingFiles calls behind a plain recoverInterrupted(tree) when either throws. Add one case to run-integrate-beside.test.cjs or run-review-recover.test.cjs: a dead mutate journal and --config naming a missing file; integrate exits with BAD_CONFIG and the message names the restored file."
    severity: major
  - id: Q2
    check: errors
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-dirt.cjs
    line: 65
    evidence: "foldBlockers returns only the dirty files that HEAD...ref changes, and foldBase (run-gate.cjs:72-75) falls through to FOLD_CONFLICT when that list is empty. Git also refuses a non fast forward merge over any staged change, touched or not. Ran in a scratch repo: staged a change to b, merged a branch that changes only a; git printed \"Your local changes to the following files would be overwritten by merge: b\" and exited 2 with no unmerged path. foldBlockers would return [] (b is not incoming), so integrate prints \"conflict folding <ref> into <branch>: .\" and asks to resolve conflicts that do not exist, the empty list this item set out to remove. Integrate now folds beside a sibling's uncommitted files, so a sibling between its git add and its git commit reaches this path; before, refuseDirty kept it unreachable."
    fix: "In foldBlockers, add the staged files to what it returns: union the incoming filter with gitFiles(tree, ['diff', '--cached', '--name-only', '--no-renames', '-z', 'HEAD']), since git refuses a merge over any of them. In foldBase, when conflicts and blockers are both empty, keep a message that does not claim a conflict (say the merge of <ref> failed and to run git merge <ref> in the tree to see why) rather than an empty conflict list."
    severity: minor
