findings:
  - criterion: "A fix restarts a gate only after the running lanes are proven stopped; until a host stop command exists, supersede refuses and the orchestrator waits, as today (brief, Interface with Skoft_CRA's lane intent)"
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-lanes.cjs
    line: 161
    evidence: "Scratch clone at 07f4b8d, one test on Delta: lane smoke on redwait with red_line '^PRODUCT RED ' and no stop, the setup the reinstall recipe gives Skoft_CRA until its stop commands land. gate --wait exits 2 on the red line. After a fix commit to src/, gate --detach --supersede refuses NO_STOP, a plain gate --detach refuses GATE_RUNNING with 'wait for it: run.cjs gate --wait', and that gate --wait --minutes 0.2 exits 2 again after 84 ms while the lane job stays alive. laneState reports running-red on every poll for as long as the walk lasts, so no wait can block on the lane, and the orchestrator spins full-context rounds of wait and refusal until the walk ends, up to two hours on Skoft_CRA. The NOT_SUPERSEDED refusal at run-supersede.cjs:78 sends it into the same spin."
    fix: "In laneState (run-lanes.cjs:156-161) report running-red only while lib.git(tree, ['rev-parse', 'HEAD']) still equals the lane job's head; once a commit lands after the red, the lane reads running, so gate --wait blocks on it until it ends and its result decides, or exits 4, as the GATE_RUNNING, NO_STOP and NOT_SUPERSEDED refusals tell the orchestrator. A job without head keeps today's running-red. Add to run-lanes-wait.test.cjs the case 'after a committed fix a red-line lane with no stop is waited on': redwait with red_line, the wait exits 2, touch src/, gate --detach --supersede refuses NO_STOP, then gate --wait --minutes 0.1 exits 4 and prints 'smoke lane still running'."
    severity: blocker
    owner: gs-a-running-lane-red-ends-the-wait
