item: gs-accept-asks-the-host-check-and-the-smoke-proof-binds-windows
verdict: fix
files:
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-lanes.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-lane-config.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-lanes-fixture.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-lanes.test.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-lanes-config.test.cjs
findings:
  - criterion: "Description 3: every caller passes the config it already holds, so on a host with both lanes the smoke proof laneNow mints is the one startLanes and green read"
    severity: major
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-lanes.test.cjs
    line: 42
    evidence: "Mutants run-lanes.cjs:257 `laneProof(tree, selected, lane, {})` (smokeOwed) and run-lanes.cjs:89 `laneProof(tree, options.config, lane, {})` (startLanes), each run on Delta with `node --test run-lanes.test.cjs` (whole file): 17 pass, 0 fail, both survive. No case on a config with a windows lane calls `green` or a second `gate --detach` after a green smoke run, so a caller that keys smoke without the windows fold goes unseen. On Skoft_CRA that is a deadlock: laneNow mints the folded key, green looks up the plain key and owes smoke forever, and the gate keeps re-running smoke."
    fix: "Add a case beside run-lanes.test.cjs:30, for example 'with a windows lane configured, a green smoke run holds for green and for the next gate': f = fixture(t, config({ smoke: '0', windows: '0' })); touch(f); passed(gated(f)); passed(run(f, 'green')); const again = run(f, 'gate', '--detach'); passed(again); assert.match(again.out, /GREEN lane smoke \\(unchanged since/); passed(run(f, 'gate', '--wait', '--minutes', '0.5')); assert.deepEqual(laneRuns(f).sort(), ['smoke', 'windows']). Both mutants above must then fail."
  - criterion: "Description 3: any lane other than smoke keys as today"
    severity: minor
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-lanes.test.cjs
    line: 283
    evidence: "Mutant run-lanes.cjs:39 drops `lane.name === 'smoke' && `, so the windows lane folds itself into its own key; run on Delta with `node --test run-lanes.test.cjs` (whole file): 17 pass, the mutant survives. No case pins the windows lane's proof key."
    fix: "In the case at run-lanes.test.cjs:254, add: const win = configuredLanes(both).find((lane) => lane.name === 'windows'); assert.equal(laneProof(f.tree, null, win, both).file, proofs.commandProof(f.tree, {}, null, win.command, win.scope).file);"
mutants:
  - criterion: "the smoke proof key folds the union of both scopes (run-lanes.cjs:41 `const scope = lane.scope;`, the earlier finding)"
    test: "remote-run.sh delta <tree> node --test --test-name-pattern=proof.changes src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-lanes.test.cjs"
    caught: yes
  - criterion: "the smoke proof changes when the windows lane's command changes (run-lanes.cjs:42 key without windows.command)"
    test: "remote-run.sh delta <tree> node --test --test-name-pattern=proof.changes src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-lanes.test.cjs"
    caught: yes
  - criterion: "any lane other than smoke keys as today (run-lanes.cjs:39 windows folds itself)"
