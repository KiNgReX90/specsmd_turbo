findings:
  - criterion: "reader-facing copy: the refusal a rerun prints for a recorded process group with members (the 526eaa7 refusal)"
    severity: minor
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-supersede.cjs
    line: 175
    evidence: "The P6 finding is closed. On Delta (clone of 526eaa7), probe P6 and the new case 'a rerun never signals a recorded group no job file of the tree names' both pass, and the stranger lives. The trap-child case and probe P2 pass, and the four AC2 suites run 43 pass 0 fail. Mutants S1 and S2 are caught. What remains is the line the rerun prints: `process group <n> still has members the flow did not start; no signal sent`, then `once it is gone: <call>`. strangers() (:125-129) knows only that no live job of this tree leads the group. It cannot tell a reused number from the tree's own leftover. The rerun exists for the second case: a first pass printed `still running after SIGKILL: process group <n>` (:186), and the rerun then calls the same group something the flow did not start. Neither line names a member, so a maker cannot tell what to stop before rerunning."
    fix: "Word the refusal as what the code knows, and list the members. For each group, scan /proc/[0-9]*/stat for pgrp (field 5) equal to the group, and print `process group <n> still has members and no job of this tree leads it, so the flow sends it no signal: pid <pid> <command from /proc/<pid>/cmdline>`, at most five members. End with `if they are the old walk, stop them, then: <gateSupersedeCall(tree)>`. In the rerun test, assert the line names `pid <stranger pid>`, and assert it no longer claims the flow did not start the group."
