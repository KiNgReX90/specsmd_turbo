findings:
  - criterion: "item part 2/3: a pending supersede reruns with --supersede, and a signal reaches only a process group the tree started (d93eb74 docstring on signal: Linux keeps that number allocated while any member of the group lives, so the signal reaches no stranger)"
    severity: minor
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-supersede.cjs
    line: 159
    evidence: "On a rerun, stopGroups(record.groups) signals every recorded number that has any member now, read from a pending file of any age. The guarantee in the comment holds only while the group never empties. In a typical case the first pass kills every group and a stop check fails. The numbers are then free, the pending file stays, and a later rerun SIGTERMs and SIGKILLs whatever group holds them by then. The flow's own gate and lane jobs of other worktrees are detached group leaders, so they are the likely holders. Probe P6 on Delta (clone of d93eb74): a detached `node -e setInterval` process stood in for a reused number. It was written into supersede-pending.json as groups [its pid] with smoke stop `node stop.cjs 0`, then `gate --detach --supersede` ran. The rerun signalled it, and the process was dead afterwards. At 7114510 the same record left it alone, because a pid was signalled only while a job file of the tree named it as a live runner."
    fix: "Bind each recorded group to the moment it was recorded. When the pending file is written (:157), also store the boot_id and this process's own /proc/self/stat starttime as `ticks`. On every pass, treat a recorded group as the tree's only while some process with that pgrp (a scan of /proc/[0-9]*/stat, field 5) has a starttime no later than `ticks` on the same boot_id. Signal only those groups, and count only those as still running. A group whose members are all younger is a reused number: drop it from the record and never signal it. After each pass, rewrite the pending file with groups set to the ones still holding such a member. Add a run-supersede.test.cjs case \"a pending rerun leaves a reused group number alone\". Make the record real with a failing stop (`node stop.cjs 1`, exit 2). Then spawn a detached stranger, set the record's groups to [its pid], switch stop to 0 and rerun `--supersede`. It exits 0, and the stranger is alive (read /proc/<pid>/stat and treat state Z as dead)."
