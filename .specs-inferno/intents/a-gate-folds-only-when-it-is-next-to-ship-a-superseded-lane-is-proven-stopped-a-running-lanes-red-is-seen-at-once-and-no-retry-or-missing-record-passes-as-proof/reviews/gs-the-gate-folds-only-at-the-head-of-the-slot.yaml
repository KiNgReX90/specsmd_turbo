item: gs-the-gate-folds-only-at-the-head-of-the-slot
verdict: fix
files:
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-gate.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-intent-review.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-lanes.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-ship.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-slot-gate.test.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-slot.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run.cjs
findings:
  - criterion: "the queued tree's wait folds and starts once the head's wait is red (description 2: wait waits in the queue, and at the deadline exits 4 with the queued line and call ... again)"
    severity: major
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-slot-gate.test.cjs
    line: 67
    evidence: "On Delta at 9e53da4, two mutants of slotWait survive the whole of run-slot-gate.test.cjs (5 pass each, 6s and 5s). The first makes the queue loop at run-gate.cjs:346 never run (for (; false; ...)). The second makes the deadline at run-gate.cjs:348 return exit 0 instead of the queued exit 4. The test calls the second tree's gate --wait only after the head's wait has already released the ticket and its jobs have ended. So no test ever has a wait blocking behind the head, and none reaches the queued deadline. A wait that never blocks would return 4 at once and make the orchestrator spin, and a wrong deadline exit goes unseen."
    fix: "Add two cases to run-slot-gate.test.cjs. (a) 'a queued wait blocks until the head's wait is red': after one's detach and two's queued detach, start two's gate --wait --minutes 0.5 asynchronously (child_process.spawn with the fixture's env: CLAUDE_BUILD_WRAPPED=1 and XDG_CACHE_HOME=f.cache). While it blocks, run one's wait to its red exit 2, then await two's wait. Assert exit 0, 'folded main into <TWO>', 'gate started pid' and 'GREEN lane smoke'. (b) 'a queued wait exits 4 at its deadline and folds nothing': while one holds the head (its exit 3 or exit 0 wait keeps the ticket), run two's gate --wait --minutes 0.05. Assert exit 4, 'queued behind <ONE> (1 ahead); nothing folded' and /call node \\S+run\\.cjs gate --wait --tree \\S+ again/. Also assert two's HEAD is unchanged and it has no gate-job.json. Both mutants above must then fail."
  - criterion: "accept renews on success (description 5, run-lanes.cjs accept)"
    severity: minor
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-lanes.cjs
    line: 275
    evidence: "Deleting 'if (mergeSlot(config)) slot.renew(tree);' at run-lanes.cjs:275 still passes run-slot-gate.test.cjs and run-lanes.test.cjs on Delta (23 pass, 0 fail). No test asserts that an accept moves the ticket's activity."
    fix: "In 'teardown and a red wait free the slot, an exit 3 keeps it', after the exit 3 wait, commit a harness file on main in the primary and merge main into one. Then read the ticket, run one's smoke --accept --harness-fix <that sha> (exit 0), and assert that the ONE ticket's activity is later than before."
  - criterion: "ship and teardown release (description 4); removeWorktree's left names what a failure leaves owed"
    severity: minor
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-ship.cjs
    line: 135
    evidence: "In removeWorktree the release at :135 runs before left.push at :136. slot.release takes the slot lock through withFileLock, which throws STATE_LOCKED when the lock or its guard is held past the timeout (state-store.cjs acquire). The readConfig on the same line can throw too. When either throws, ship's catch prints 'left to do: ' with nothing named, although the worktree removal and the branch delete are still owed. teardown prints the same empty list."
    fix: "Move the left.push(...) of the two git steps above the release line. A failed release then still names both steps in 'left to do'. Keep the release before stopOwnedProcesses."
