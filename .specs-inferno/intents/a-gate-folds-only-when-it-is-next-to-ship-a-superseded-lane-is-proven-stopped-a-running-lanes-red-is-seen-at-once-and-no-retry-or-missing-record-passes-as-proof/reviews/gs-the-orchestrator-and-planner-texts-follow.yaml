findings:
  - criterion: "Description 3: config.example says what each lane key does, as the scripts behave"
    severity: major
    file: src/flows/inferno/agents/orchestrator/config.example.yaml
    line: 67
    evidence: "ba545d0 rewrote the stop comment as 'proves a superseded walk gone wherever it runs, exit 0, and kills nothing. It runs in the tree after the flow has sent SIGTERM and SIGKILL to the lane job's process group'. At d93eb74 run-supersede.cjs:8-9 says the host stop proves the walk gone 'because only the host knows where a walk runs outside those groups', and the supersede item's notes (gs-supersede-proves-the-running-lanes-stopped.md:81) say the host's stop 'kills the walk pids and the Beta task and proves the Delta lock free'. A host that follows 'kills nothing' writes a check that waits on a remote walk the flow cannot reach, and supersede stays pending until that walk ends. Also, stopGroups (run-supersede.cjs:125-131) sends SIGKILL only to a group that still has a member after the grace period, so 'sent SIGTERM and SIGKILL' is not what always happens."
    fix: "stop comment: '# optional: the host command that stops a superseded walk wherever it runs outside the lane job's process group, and exits 0 once the walk is gone. It runs in the tree after the flow has sent SIGTERM to that group and SIGKILL to any member left, with INFERNO_LANE, INFERNO_LANE_PID, INFERNO_LANE_LOG and INFERNO_GATE_CONFIG set. Without it gate --detach --supersede refuses and the lane is waited on.' Drop 'and kills nothing'."
  - criterion: "Scope: edits stay inside the item's ownership.editable"
    severity: minor
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-printed-calls.test.cjs
    line: 195
    evidence: "ba545d0, this item's correction, adds the gateSupersedeCall and slotCall rows to run-printed-calls.test.cjs:195-200. That file is not in the item's ownership.editable (work item spec, ownership block), and the earlier review gave the fix to gs-supersede-proves-the-running-lanes-stopped and gs-a-direct-build-takes-the-slot-and-starts-only-the-lanes. The rows are right: node --test on the suite at d93eb74 prints # pass 10, # fail 0, and both mutants below are caught."
    fix: "Keep the rows and record the file where it belongs: add src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-printed-calls.test.cjs to this item's ownership.editable (planner or orchestrator repair of the spec), or credit the change to gs-supersede-proves-the-running-lanes-stopped, so verify-item's ownership check and the item record agree with the commit."
