  - criterion: "AC1 date and tally case (inferno-flow.test.ts:385): no counted duration in agent text"
    test: "remote-run.sh delta <clone of 7114510> env -C src npx vitest run __tests__/unit/inferno/inferno-flow.test.ts -t 'no flow md file carries a date', with agent.md:111 'and gates the fix.' made 'and gates the fix within 15 minutes.'"
    caught: yes
  - criterion: "Constraint: no em or en dash (inferno-flow.test.ts:366) in the new config comments"
    test: "remote-run.sh delta <clone of 7114510> env -C src npx vitest run __tests__/unit/inferno/inferno-flow.test.ts -t 'no file under the flow carries an em or en dash', with an em dash put into config.example.yaml:67"
    caught: yes
  - criterion: "AC1 gate text case (inferno-flow.test.ts:233): the pinned gate sentences kept"
    test: "remote-run.sh delta <clone of 7114510> env -C src npx vitest run __tests__/unit/inferno/inferno-flow.test.ts -t 'the orchestrator waits for the gate through gate --detach', with agent.md:109 'the tree it proves' made 'the tree it checks'"
    caught: yes
