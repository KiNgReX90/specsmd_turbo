    caught: yes
  - criterion: "on the base branch without --since the lanes diff from origin/<base> (run-lanes-only.cjs:51, return origin becomes return null)"
    test: "remote-run.sh delta <clone of 97e34e7> node --test '--test-name-pattern=diffs the commits origin lacks' S/run-slot-cli.test.cjs"
    caught: yes
  - criterion: "on the base branch with no origin and no --since the start is refused (run-lanes-only.cjs:45, the check becomes if (false))"
    test: "remote-run.sh delta <clone of 97e34e7> node --test '--test-name-pattern=with no origin and no --since is refused' S/run-slot-cli.test.cjs"
    caught: yes
  - criterion: "on the base branch with origin/<base> at HEAD the start is refused (run-lanes-only.cjs:45, the HEAD comparison dropped)"
    test: "remote-run.sh delta <clone of 97e34e7> node --test S/run-slot-cli.test.cjs"
    caught: no
  - criterion: "a red lanes-only wait releases the job's holder (run-lanes.cjs:214, slot.release(tree, job.holder) becomes slot.release(tree))"
    test: "remote-run.sh delta <clone of 97e34e7> node --test \"--test-name-pattern=releases the driver's ticket\" S/run-slot-cli.test.cjs"
    caught: yes
  - criterion: "the lanes-only job records the driver's ticket as its holder (run-lanes-only.cjs:59, the default returns null)"
    test: "remote-run.sh delta <clone of 97e34e7> node --test S/run-slot-cli.test.cjs"
    caught: yes
  - criterion: "an explicit --holder names the released ticket (run-lanes-only.cjs:56, if (options.holder) becomes if (false))"
    test: "remote-run.sh delta <clone of 97e34e7> node --test S/run-slot-cli.test.cjs"
    caught: no
  - criterion: "gate takes --holder only with --detach --lanes-only (run-gate.cjs:387, the check becomes if (false))"
    test: "remote-run.sh delta <clone of 97e34e7> node --test S/run-slot-cli.test.cjs"
    caught: no
