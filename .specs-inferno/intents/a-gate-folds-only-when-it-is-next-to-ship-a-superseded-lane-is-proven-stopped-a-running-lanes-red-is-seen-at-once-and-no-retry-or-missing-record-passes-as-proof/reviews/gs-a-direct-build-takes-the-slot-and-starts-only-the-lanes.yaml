item: gs-a-direct-build-takes-the-slot-and-starts-only-the-lanes
verdict: fix
files:
  - src/__tests__/unit/inferno/printed-calls.test.ts
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-call.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-gate.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-lanes-only.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-lanes.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-slot-cli.test.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-slot.cjs
  - src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run.cjs
findings:
  - criterion: "a red wait releases the ticket (brief Decisions): a red lanes-only wait releases the driver's ticket and no other"
    severity: major
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-lanes-only.cjs
    line: 58
    evidence: "releaseHolder defaults to the first ticket in the queue, whoever holds it. Probe on Delta (clone of 97e34e7): driver took the slot on main 31 minutes ago, a linked worktree took `slot --take --holder inferno-intent/other` (printed `evicted driver`, other at the head), then the pinned call `gate --detach --lanes-only --since HEAD~1` on main recorded `holder: inferno-intent/other` in the job, and the red wait (smoke exit 10) released it: the queue went from [\"inferno-intent/other\"] to []. The driver procedure takes the slot before the edit and starts the lanes only after the edit, commit and verification, so its ticket idling out first is a normal path, and the red then drops another intent from the queue. Mutant N6 (`if (options.holder)` becomes `if (false)`) also stays green: no test passes --holder to the gate."
    fix: "In releaseHolder, without --holder pick the first ticket whose `tree` resolves (fs.realpathSync) to this tree, else null, never a ticket of another worktree. Add run-slot-cli cases: \"a red lanes-only wait leaves another worktree's ticket queued\" (git worktree add a second tree, take its ticket first, start lanes-only red on main without a driver ticket, wait exits 2, the other ticket is still queued) and \"--holder names the ticket a red lanes-only wait releases\" (tickets first and driver, `--holder driver`, red wait leaves [\"first\"])."
  - criterion: "on the base branch without --since the start refuses BAD_ARGS when origin/<base> equals HEAD (coordinator decision 1)"
    severity: minor
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-lanes-only.cjs
    line: 45
    evidence: "The refusal works (probe on Delta: commit pushed to origin before the start, `gate --detach --lanes-only` exited 1 with `ERROR [BAD_ARGS] on main with no unpushed commit to diff`), but no test reaches it: mutant N3 (`if (!origin || origin === HEAD)` becomes `if (!origin)`) left the whole run-slot-cli.test.cjs at 11 pass 0 fail. Without it a driver that pushed before starting its lanes gets an empty diff, every lane SKIPs and the wait is green."
    fix: "Add a run-slot-cli case \"gate --detach --lanes-only on the base branch after the push is refused\": pushedOrigin(f), touch(f), push main again, the start exits 1, stderr matches /BAD_ARGS/ and /--since/, and no lane-smoke-job.json exists."
  - criterion: "gate takes --holder only with --detach --lanes-only (added by the correction)"
    severity: minor
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-gate.cjs
    line: 387
    evidence: "Mutant N7 (`if (options.holder && !options.lanes_only) throw` becomes `if (false) throw`) left the whole run-slot-cli.test.cjs at 11 pass 0 fail: no test sends --holder to a gate without --lanes-only."
    fix: "Extend the \"--since without --lanes-only is refused\" case: `gate --detach --holder driver` exits 1 and stderr matches /--holder/."
mutants:
  - criterion: "earlier finding: --since naming no commit is BAD_REF exit 2 (run-lanes-only.cjs:31, the throw becomes if (false))"
    test: "remote-run.sh delta <clone of 97e34e7> node --test '--test-name-pattern=an unknown ref is refused' S/run-slot-cli.test.cjs"
    caught: yes
  - criterion: "earlier finding: every printed slot call is built in run-call.cjs (run-slot.cjs:219, a hand-built slot --take call in the renew line)"
