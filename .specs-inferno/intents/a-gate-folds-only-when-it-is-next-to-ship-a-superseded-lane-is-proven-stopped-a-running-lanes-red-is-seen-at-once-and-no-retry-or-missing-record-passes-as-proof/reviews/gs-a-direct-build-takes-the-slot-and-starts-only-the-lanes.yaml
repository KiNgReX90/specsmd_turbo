findings:
  - criterion: "gate --detach --lanes-only on the base branch starts the lanes the diff touched, and gate --wait waits on them (wiring: the host driver's pinned call)"
    severity: major
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-gate.cjs
    line: 296
    evidence: "Probe on Delta (clone of 1fdca3d, lanes fixture on main with merge_slot, holder driver, one commit touching src/), then `gate --detach --lanes-only` with no --since: the start printed `SKIP smoke (no path in scope changed)` and exited 0, `gate --wait` printed only `green dc6d41c1...` and exited 0, and no lane ran (.lane-runs absent). On the base branch the default `mergeBase(tree, base)` is HEAD, so the diff is empty. Skoft_CRA's driver item pins exactly that call without --since (ral-a-direct-commit-holds-the-merge-slot.md:22, `run.cjs gate --detach --lanes-only --tree <tree>`), so a direct commit passes its wait with no lane walked, the hole plan 2i exists to close."
    fix: "In the lanes_only branch of gateDetach, when options.since is absent and mergeBase(tree, base) equals `git rev-parse HEAD`, throw RunError(`gate --detach --lanes-only on ${base} needs --since <the commit before your edit>: the merge base is HEAD, so no lane would see the commit`, 'BAD_ARGS', 1) before startLanesOnly. Add a run-slot-cli.test.cjs case \"--lanes-only on the base branch without --since is refused\": on main after touch(f), exit 1, stderr names --since, and no lane-smoke-job.json in the cache. An explicit `--since HEAD` stays the skip the existing case proves."
  - criterion: "builder decision: --since naming no commit is refused BAD_REF exit 2"
    severity: minor
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-lanes-only.cjs
    line: 26
    evidence: "The refusal works (probe on Delta: `gate --detach --lanes-only --since nosuchref` exited 2 with `ERROR [BAD_REF] --since nosuchref names no commit`), but no test proves it: mutant `if (!sha) throw` to `if (false) throw` left the whole run-slot-cli.test.cjs at 7 pass 0 fail. Without the guard the tolerated `git diff --name-only nosuchref` yields no path, every lane SKIPs and the wait is green."
    fix: "Add a run-slot-cli.test.cjs case: on main after touch(f), `gate --detach --lanes-only --since nosuchref` exits 2, stderr matches /BAD_REF/ and /--since nosuchref/, and no lane-smoke-job.json exists under the branch cache dir."
  - criterion: "every run.cjs call a script prints is built in run-call.cjs (brief constraint; item part 3, slotCall)"
    severity: minor
    file: src/__tests__/unit/inferno/printed-calls.test.ts
    line: 27
    evidence: "STEPS (:27-30) lists every runner subcommand the guard knows, and the new `slot` is not among them, so SUBCOMMAND_FLAG and the Codex call regex cannot flag a hand-built slot call. Mutant: run-slot.cjs renew line printing `${holder} holds no ticket; take one with: slot --take --holder ${holder} --tree ${tree}`; `npx vitest run __tests__/unit/inferno/printed-calls.test.ts` stayed 4 passed."
    fix: "Add 'slot' to STEPS in src/__tests__/unit/inferno/printed-calls.test.ts (extend this item's ownership to that file) and an expectation in 'flags each kind of hand-built call and pointer' that `out.push(`take again with: slot --take --holder ${h}`);` is flagged; the vitest file stays 0 failed."
  - criterion: "a red wait releases the ticket (brief Decisions), as the host driver expects for a direct build"
    severity: minor
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-lanes-only.cjs
    line: 42
    evidence: "Probe on Delta: holder driver took the slot on main, `gate --detach --lanes-only --since HEAD~1` with a smoke lane exiting 10, `gate --wait` exited 2 with `RED lane smoke: product red (exit 10)`, and the queue still held [\"driver\"]. waitAll releases the tree's branch holder on red (run-lanes.cjs:213, here `main`), which a direct driver never is, and the lanes-only job records no holder. Skoft_CRA's driver item relies on the flow for it (ral-a-direct-commit-holds-the-merge-slot.md:25, `the flow releases the slot on a red verdict`), so a red direct lane holds every other intent behind it until the ticket idles out."
    fix: "Accept an optional `--holder <name>` on `gate --detach --lanes-only` (the Options entry for --holder names it; the pinned usage line stays verbatim), record it as `holder` in the lanes-only job (run-lanes-only.cjs:42-45), and release `job.holder` in waitAll's red branch (run-lanes.cjs:213, `slot.release(tree, job.holder)`, which falls back to the branch when unset; extend ownership to run-lanes.cjs). Add a run-slot-cli case \"a red lanes-only wait releases the driver's ticket\": smoke exit 10, wait exits 2, the queue is empty."
