findings:
  - criterion: "the intent's own wiki edit after the review voids it"
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-intent-owed.cjs
    line: 111
    evidence: "On Delta, in a private clone at 381f2df, the mutant that drops '&& !own.has(file)' from the skip at :111 left run-review-outside.test.cjs at 9 pass, 0 fail (the first review caught the same mutant at 8265a81). The correction's own-kb name list at :110 now voids the existing case by itself, because that case commits a new path, so nothing pins that an own kb page's content stays in the hash. A probe case (the branch commits wiki/own.md before the review, the review is recorded with the OUTSIDE config, gate exits 0, the branch edits and commits wiki/own.md again, gate) exits 3 on the real code and 0 under the mutant: the review stays current over the intent's own kb edit."
    fix: "Add the case 'the intent's second edit of its own kb page after the review voids it' to run-review-outside.test.cjs: the branch writes and commits wiki/own.md together with the work, intentReviewed(tree, 'alpha', 'verdict: clean\\n', lib.readConfig(tree)), gate exits 0, the branch rewrites wiki/own.md and commits, gate exits 3 and prints 'intent review owed: the code changed since the review'. Dropping '&& !own.has(file)' at run-intent-owed.cjs:111 must then make it fail."
    severity: minor
