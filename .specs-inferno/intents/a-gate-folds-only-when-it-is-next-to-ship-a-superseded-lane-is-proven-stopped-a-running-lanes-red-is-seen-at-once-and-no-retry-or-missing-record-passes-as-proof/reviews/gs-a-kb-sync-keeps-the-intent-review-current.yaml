findings:
  - criterion: "Amendment 4 (binding) and Technical Notes: a kb path is exempt only while the branch's version equals the base's; an intent's own wiki or grok edit still voids its review"
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-intent-owed.cjs
    line: 108
    evidence: "On Delta, in a private clone at 8265a81, run-review-outside.test.cjs:57 was replaced by: commit wiki/page.md on main, merge main into the branch, record the review with the OUTSIDE config, git rm wiki/page.md and commit, then gate. The gate exited 0 ('PASS 0s echo gated') where 3 was asserted, so the intent's own deletion of a base wiki page kept the review current. Cause: scopeHash (run-proofs.cjs:29-37) hashes only paths present in ls-tree HEAD or dirty, so a kb path skipped at the review and the same path deleted by the intent both leave no entry; own.has(file) is never asked about a path that is gone. git diff main...HEAD -- wiki/page.md is not empty, so amendment 4 does not exempt it, and the whole-tree rule this replaces did void it."
    fix: "In outsideHash, put the intent's own kb paths into the hash so a deletion changes it: const ownKb = [...own].filter((file) => lib.matchesAny(file, globs)).sort(); return a sha256 over JSON.stringify([proofs.scopeHash(tree, null, { skip }), ownKb]) (or add each own kb path missing from the tree as a tombstone entry). Add the case 'the intent's own deletion of a base wiki page after the review voids it' to run-review-outside.test.cjs: wiki/page.md committed on main and merged into the branch, review recorded with the OUTSIDE config, the branch deletes and commits wiki/page.md, gate exits 3 with 'intent review owed'."
    severity: major
  - criterion: "Description 2: a kb path in git diff --name-only origin/<base>...HEAD (when origin/<base> resolves) stays in the hash"
    file: src/flows/inferno/agents/orchestrator/skills/orchestrate/scripts/run-intent-owed.cjs
    line: 97
    evidence: "run.cjs mutate --batch replaced refs.push(`origin/${base}`) with void 0 and ran node --test run-review-outside.test.cjs on Delta: 7 pass, 0 fail (caught no). No case in run-review-outside.test.cjs sets up a remote, so the origin read, the half of the rule that keeps a doubtful path in the hash, is unproven."
    fix: "Add a case with an origin remote: a bare repo as origin with main pushed, the review recorded with the OUTSIDE config, then a wiki/page.md commit on local main only (not pushed), so the path differs from origin/main's merge base; gate exits 3 with 'intent review owed'. The mutant at :97 must then make it fail."
    severity: minor
