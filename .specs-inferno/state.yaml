      SOURCE. Items 7 to 11 of Skoft_CRA docs/clean-code/tooling.md (lines 16-21), decided by the clean-code lead on 2026-11-09 as one flow intent, reinstalled later on the lead's go.
      INTENT. (a) five runner defects across integrate's diff anchor, its dirty refusal and its ledger commit, verify-item's attribution and the run config record; (d) the attribution and the config record own disjoint files and build beside the integrate chain.
      MEASURED at 2205834 by evidence/runner-defects.sh. A commit on main prints SKIP for its scoped check and exits 0, and with doubles exits 2 BAD_CONFIG; a pending review file outside every scope exits 2 DIRTY; ownedBy of a collapsed untracked dir is false; a bare integrate after a --config one runs the repo config. Three attribution cases assert the wait on a disjoint dispatch. completeItem also rewrites the work-item file, so the ledger commit stages it beside state.yaml.
      DECISIONS. Integrate inherits the lanes-only since rule of 97e34e7 and runs every scoped check when nothing gives a diff; it refuses only dirt inside the scopes of the checks it runs, the items' own files and the ledger files; the gate keeps its whole-tree refusal; an unexplained change beside a disjoint open dispatch waits for it; the run config lives in cacheDir/<branch>/run-config.json for intent run branches only, read by worktree, integrate, gate, green, ship and the lane accepts; no flow-side reservation refusal.
      CHAIN. The dirt item follows the anchor item and the ledger item; attribution and the config record start at once; run-integrate.cjs and run.cjs overlaps serialize in the orchestrator. Every edit sits in the orchestrate scripts dir, no agent or skill text.
      INSTALLED COPY. None in this repo; the drift test installs into a sandbox. TESTER. None. LOOK. None.
