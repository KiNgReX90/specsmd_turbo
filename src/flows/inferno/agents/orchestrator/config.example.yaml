# INFERNO per-project configuration. Copy to .specs-inferno/config.yaml in the
# consuming repo and fill in your values, or run /specsmd-inferno-config to be
# walked through it. Read by the orchestrator agent and by
# skills/orchestrate/scripts/run.cjs. Every key is optional: a missing key falls
# back to host and project defaults, so an absent config still yields a working
# flow. This file is where ALL project- and machine-specific values live; the
# flow files stay portable. The values below are examples, not defaults to copy.

host: claude                      # claude or codex: the fleet this file configures, which decides the agent names run.cjs prints; when absent, codex for config.codex.yaml and claude for any other file

autonomy:
  level: full                     # full or review; accepted for compatibility, the planner never pauses either way

# Model per builder tier and oracle route. Values are passed VERBATIM as the per-dispatch model override,
# so use a form the host accepts (full model IDs keep a tier pinned to a release).
models:
  strong: claude-opus-5-5         # builders on complexity medium and high
  cheap: claude-sonnet-5-5        # builders on complexity low
  escalate: claude-opus-5-5       # the fresh builder that takes over an item at its second miss, cause first
  oracle: claude-opus-5-5         # the oracle on the normal route, every ask whose impact and complexity are not both high; absent, roles.oracle, else the oracle's own pin. Its effort is the oracle role's, xhigh by default
  # oracle_hard: claude-fable-5-2 # the oracle on the hard route, an ask graded high on both; set it only when the account has that tier: without it every ask takes the normal route. Codex has no hard route, its oracle's pin is the host's top tier

# Optional: model and effort per role, rendered into the installed agent and command
# files at the next install, so a host never edits an installed file. A role or key
# left out keeps the flow default shown here. Codex roles live in config.codex.yaml.
# roles:
#   builder: {model: claude-opus-5-5, effort: high}
#   builder-cheap: {model: claude-sonnet-5-5, effort: high}
#   builder-escalate: {model: claude-opus-5-5, effort: xhigh}
#   config: {model: claude-sonnet-5-5, effort: high}
#   oracle: {model: claude-opus-5-5, effort: xhigh}
#   planner: {model: claude-opus-5-5, effort: xhigh}
#   reviewer-quality: {model: claude-opus-5-5, effort: high}   # the quality lens beside the contract review of every item
#   scanner: {model: claude-opus-5-5, effort: high}

# planner:
#   test_trees: ["src/**/*.test.ts", "e2e/**"]          # where the planner's blast-radius grep finds the tests it lists; omit for every test tree

# budget:
#   script: ~/tools/flow-text-budget.py                 # the flow text budget script; else INFERNO_FLOW_BUDGET, else $XDG_DATA_HOME/specsmd-inferno/flow-text-budget.py

review:
  model: claude-opus-5-5          # the cold reviewer run.cjs review dispatches after every item and before the gate
  # outside: ["wiki/**"]          # optional: path globs where a change a fold of the base brings in keeps the intent review current while the intent never touched the file, such as a knowledge base the base branch syncs; ["**"] binds the review to the files the intent changed, so only a fold that changes one of them voids it, and the delta review's dispatch names those files and the base's change to read; without it any folded change voids the review; a --config file inherits it

scan:
  model: claude-opus-5-5          # the four cold scanners run.cjs scan dispatches before the intent review; absent, roles.scanner, else the scanner role's own pin. On Codex the role entry alone decides

verification:
  finalize:                       # ordered shell commands forming the authoritative gate, run once per intent
    - npm run check
    - cargo test --workspace
    - npm run test:e2e
  # merge_slot: true              # optional: gate --detach folds and starts only when its ticket heads one queue shared by every worktree of the repository; without it every gate folds and starts at once
  # ship_cleanup: "node scripts/ship-cleanup.mjs"   # optional: the host command ship and teardown run from the primary checkout once the worktree and branch are gone, with INFERNO_BRANCH and INFERNO_TREE set; a failure prints its line and never undoes the ship; without it ship and teardown leave the branch's cache folder and print a line naming it
  # lint:                         # optional: lint and analysis commands the quality reviewer runs once per item review, in the worktree; its dispatch carries one lint line per command, and it takes over only what they report on lines the item added
  #   - npm run lint
  integrate:                      # optional: the cheap checks, run by `run.cjs integrate` after every item lands, on the committed tree with the base folded in; a red goes back to the warm builder instead of waiting for the gate
    - npm run check
  finalize_scopes:                # optional: a listed command runs only when the diff since the merge base touches a matching path, an unlisted command always runs
    "cargo test --workspace": ["src-tauri/**", "Cargo.*"]
    "npm run test:e2e": ["src/**", "src-tauri/**", "e2e/**", "package.json", "package-lock.json", "playwright.config.*"]
  # session:                      # optional: for checks that run through a wrapper which syncs the tree to another machine and waits there for a slot; the commands of one integrate, or of one gate's finalize list, that match reaches run back to back in one session of the wrapper, so the tree is synced and the slot taken once, not once per command, and each keeps its own proof as without the key; a command match does not reach runs here as before; the session opens at the first such command that runs, so skipped and still-green checks open nothing; each command runs in the tree under bash with INFERNO_TREE and INFERNO_SESSION, an empty directory of this session outside the tree for the wrapper's own state; a session that does not open fails every command it would run, and none of them runs; a --config file inherits it
  #   match: '^tools/remote-test\.sh \S+ '    # a regex in single quotes that marks a command as going through the wrapper when it matches at its start; the rest of the command is the check the session runs
  #   open: "tools/remote-test.sh open"        # copies the whole tree as it stands into a fresh session and takes the slot
  #   run: "tools/remote-test.sh run"          # runs INFERNO_TEST, the check, in the session; its output and exit code are the check's
  #   close: "tools/remote-test.sh close"      # gives the session and the slot up; it runs on every exit once open started, and in the next integrate or gate in the tree when a kill skipped it, so it exits 0 when nothing is open
  # refused: '^remote-run: REFUSED '   # optional: a regex in single quotes of the line the host's wrapper prints when it ran nothing (machine gone, session slot ended); a check, or a session open, that exits non-zero with such a line is no verdict, mints no proof and runs once more, in a fresh session where it has one; a second refusal ends integrate or the gate with exit 5 and a line to run the step again, and no FAIL; a non-zero exit without the line fails as before; a regex an empty line matches is refused; a --config file inherits it
  # Lanes, optional: gate --detach starts each lane whose scope the diff since the merge base touched, gate --wait waits
  # for it, and green owes the smoke lane while it is in scope. A --config file inherits each lane it does not set.
  # Exit contract of a lane command: 0 green, 10 product red, 11 instrument red, and any other code is instrument red.
  # The host runner retries once itself and the flow never retries a lane. An instrument red passes only against a
  # harness fix already on the base branch, and a product red only when the lane's verdicts prove it intermittent, each
  # through the step gate --wait prints. gate --detach --lane <name> walks one lane again, also while the gate job runs.
  smoke:                          # a short smoke run of the built app
    command: npm run smoke
    scope: ["src/**", "src-tauri/**"]
    # accept_check: npm run smoke:accept   # optional: the host check an instrument red must pass to be accepted. It runs in the tree with INFERNO_LANE, INFERNO_LANE_LOG, INFERNO_LANE_RUN and INFERNO_GATE_CONFIG set. Exit 0 accepts, and any other exit refuses with its last line. Without it the harness fix alone accepts.
    # stop: npm run smoke:stop             # optional: the host command that stops a superseded walk wherever it runs outside the flow's process groups, such as on another machine, and exits 0 only once that walk is gone. It runs in the tree with INFERNO_LANE, INFERNO_LANE_PID, INFERNO_LANE_LOG and INFERNO_GATE_CONFIG set, once the flow has sent SIGTERM to the lane job's process group and SIGKILL to that group if a member outlives the grace period. Any other exit keeps the supersede pending and prints its last line. Without it gate --detach --supersede refuses and the lane is waited on.
    # red_line: '^PRODUCT RED '            # optional: a regex in single quotes; a log line matching it turns gate --wait red while the lane walks on; without it a red shows when the lane ends
    # verdicts: ../smoke-verdicts.json     # optional: the file, relative to the tree, the lane command writes on a product red, as {"red": [{"name": "<test>", "base": "green", "again": "green"}]}: one entry per test red on the branch, with its walk on the base and its second walk on the branch. Only while the file was written since the run started and every entry reads green twice does run.cjs smoke --accept-intermittent accept the red, naming each test, its reason and its signer. Ship writes the accept into the ship commit as one exception: line; past two accepts of a test on the base, the next waits for a commit there carrying "Fixes-intermittent: <test>". Without it a product red has no accept.
  windows:                        # the suite on a Windows machine
    command: npm run test:windows
    scope: ["src/**", "src-tauri/**"]

doubles:                          # optional: refuses a branch that raises the count of test files matching pattern, against the merge base; a --config file inherits it
  pattern: '__TAURI_INTERNALS__'  # a regex in single quotes for a hand-built double; paths and exclude are globs
  paths: ['e2e/**']
  exclude: ['e2e/contract.ts']

wiring:                           # optional: per kind (command, table or event), the host file that registers it; frontier refuses an item that consumes one no item of its intent provides and this file does not register; a --config file inherits it
  command:
    file: src-tauri/src/commands/mod.rs
    within: 'generate_handler!\[([\s\S]*?)\]'   # a regex in single quotes; its last group is the registering block
    name: '(?:\w+::)*(\w+)'                     # a regex run over that block; its last group is one registered name

# real_app:                       # optional: globs of the helpers and case texts that drive the real app binary; probes tells each builder to update them, and the reviewer dispatch carries the check that lists every line there still naming a test id, label or route the diff removed and every file there that drives a screen the diff changed; a --config file inherits it
#   paths: ["integration/lib/**", "integration/*.test.mjs"]
#   prove: "node integration/prove-journeys.mjs"   # optional: the command that runs, on the real app binary, the journeys an item changed; verify-item runs it in the tree, with INFERNO_TREE and INFERNO_JOURNEYS (a file listing the item's changed paths under paths that the tree still holds, one per line), whenever there is one, records the run in the item's proof, fails on a red, and the item's review waits for that run; without it no item runs a journey and the gate's lanes run a new case first

# cases:                          # optional: the tester case texts every landing answers for; integrate, the gate and `run.cjs cases --range` refuse a range that leaves a case naming a removed label, reaches a case it neither edits nor names on a "Cases: TC-1, TC-2" commit line, or changes a test with no case edited and no Cases line ("Cases: none" answers that rule only); a --config file inherits it
#   files:
#     - path: integration/TEST-CASES.md
#       case: '^### (TC-\d+)'           # a regex in single quotes over one line; group 1 is the id of the case it opens
#     - path: docs/RELEASE-RUNBOOK.md
#       case: '^\s*- \*\*([A-Z][\w-]+)\*\*'
#       rules: [stale]                  # this file answers only for labels the range removed
#   tests: ["integration/*.test.mjs"]   # the tests whose `test(` blocks name the case ids they prove
#   sources: ["src/**", "src-tauri/src/**"]   # product source; the tests and case files are never source
#   expectations: ["e2e/**", "src/**/*.test.ts"]   # tests whose changed lines a case may describe

# mutate:                         # optional: how run.cjs mutate runs a mutant on this host; a --config file inherits it
#   reseal_seconds: 300           # optional: the most seconds one reseal may run; past it, mutate ends the reseal and every process it started (default 300)
#   sealed:                       # optional: files the host seals with a manifest of their digests; run.cjs mutate runs the reseal after a mutant lands in one, so the test sees a valid seal; every other path the reseal changed gets its bytes from before back after the revert, on every exit; a reseal that exits non-zero reads no verdict, and one that a signal ended or that ran past reseal_seconds reads no verdict and stops the run
#     - paths: ["definitions/**"]                          # globs of the sealed files and of the seal; a seal git ignores goes back only when these globs cover it
#       reseal: "node scripts/lib/definitions/pack.mjs --write"   # the command that rewrites the seal, run in the tree
#   session:                      # optional: for tests that run through a wrapper which syncs the tree to another machine and waits there for a slot; the mutants of a batch that share one such test command share one session of the wrapper, so the tree is synced and the slot taken once, not once per mutant; per mutant the changed file (and every path its reseal changed) is sent, the test runs, and the file is put back and sent again; each command runs in the tree under bash with INFERNO_TREE and INFERNO_SESSION, an empty directory of this session outside the tree for the wrapper's own state; a session that does not open, or a send that fails, reads no verdict, a send back that fails stops that session's mutants, and a command a signal ended stops the run
#     match: '^tools/remote-test\.sh \S+ '    # a regex in single quotes that marks a test command as going through the wrapper when it matches at its start; the rest of the command is the test the session runs
#     open: "tools/remote-test.sh open"        # copies the whole tree as it stands into a fresh session and takes the slot
#     send: "tools/remote-test.sh send"        # puts INFERNO_FILE, a path relative to the tree, into the session as the tree holds it now, and deletes it there when the tree no longer does
#     run: "tools/remote-test.sh run"          # runs INFERNO_TEST in the session; its output and exit code are the test's
#     close: "tools/remote-test.sh close"      # gives the session and the slot up; it runs on every exit once open started, and in the next step that reads the tree when a kill skipped it, so it exits 0 when nothing is open
#   run: "tools/remote-test.sh {tree} {test}"   # optional: the wrapper every mutant test runs through, so a reviewer writes the bare test and the host decides the machine; {tree} and {test} each go in once as one single-quoted shell word, a test that already starts with the wrapper's own words runs as written, session.match reads the wrapped command, and the wrapper passes INFERNO_MUTANT on to the test; {test} is one shell word, so the wrapper runs its last argument under a shell, and a wrapper that runs its arguments as a command line takes the key as "<wrapper> {tree} bash -c {test}"
#   wrapped: '^(?:\w+=\S* +)*"?(?:~|/home/dev/acme-shop)/tools/remote-test\.sh"? '   # optional, beside run: a regex in single quotes of the other ways recorded tests already spell the wrapper (an environment prefix, its absolute path or its path under ~, in double quotes); a test it matches at its start, as the reviewer wrote it, runs as written beside one that starts with the wrapper's own words; without it only those words count
#   checks:                       # optional: the host's checks (a contract script, a lint), which print no test runner's summary; a red run of a listed check that printed its finding line reads caught, and one that printed no such line (a wrapper error) reads no verdict
#     - match: '^npm run check:wire\b'     # a regex in single quotes that marks a test command, as the reviewer wrote it, as this check
#       finding: '^WIRE MISMATCH: '         # a regex in single quotes of the line the check prints on a finding

# standards:                      # optional: the project's rule files under .specs-inferno/standards/, each with the path globs it applies to; dispatch-log prints every file that applies to a builder's ownership.editable, and a listed file that does not exist refuses the dispatch; /specsmd-inferno-standards drafts them; a --config file without the block takes this one
#   - file: typescript.md
#     paths: ["src/**/*.ts", "src/**/*.tsx"]
#   - file: copy.md
#     paths: ["src/copy/**"]

worktree:
  bootstrap:                      # optional: commands run inside a fresh intent worktree before the first dispatch
    - npm ci

dispatch:
  constraints:                    # optional: lines pasted VERBATIM into every builder and tester dispatch (machine limits, wrappers, what may not run in parallel)
    - "Heavy commands (builds, test suites, cargo) run bare; a machine-wide guardrail wraps them. Exit 137 or 143 is the cap: run once more, then report."
  # tools:                        # optional: the tools the roles and checks use, each with the version every machine of the host installs; `run.cjs tools` proposes the tools that fit the stack, `--write <id,id>` writes the accepted ones here and in verification.integrate and dispatch.constraints, and it prints a line for each listed tool this machine lacks
  #   shellcheck: "0.10.0"
  #   ast-grep: "0.39.0"

# Delivery mode: how the orchestrator integrates and closes an intent.
#   auto-close    (default) commit each item on the intent branch, then merge
#                 locally into the base branch, tear down the worktree, push.
#   merge-request each item lands via a non-blocking merge request, and the
#                 intent closes by opening one merge request into the base
#                 branch as the single human review gate. Uses gh or glab.
# delivery:
#   mode: auto-close              # auto-close or merge-request
#   base_branch: main             # the branch an intent merges into; omit to have the orchestrator propose and confirm

# recovery:
#   idle_minutes: 60                                     # an in_progress intent is offered for recovery only after this long with no process, edit or commit in its worktree

# halt:
#   flag_file: /absolute/path/to/HALT                    # checked before every dispatch round
#   wait_script: /absolute/path/to/wait-for-reset.sh     # launched in the background at halt, exits when the budget window resets

# knowledge:
#   index: docs/knowledge/index.md                       # index builders walk first when curated context is insufficient
