<!doctype html>
<!--
  AI-DLC Turbo intent overview.

  This file is a template. scripts/intent-overview.cjs fills it: it puts the page data
  (the intent, its stories, the pictures from the record and the test cases, all in
  the record's language) into the <script id="overview-data"> block, the string table
  of that language into <script id="turbo-text"> (every fixed text the scripts show)
  and into the {{key}} places of the HTML, and the Turbo logo into the masthead.
  Never edit a generated overview.html by hand: rerun the script.

  Layout: a night masthead with the intent, then the lifecycle of the main thing the
  intent builds as a swimlane flow with the stories on its steps, the stories as
  vertical slices through the system layers, the planned integration tests as arrows
  between build steps, and what stays out of scope. A click on any story opens a side
  panel with its user story, acceptance criteria, code, integration and test cases. A
  section without data is left out.
-->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{overview.title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #1C1230;
    --violet: #D700D7;
    --lilac: #FF87FF;
    --orange: #FF875F;
    --yellow: #FFD75F;
    --led: #34D17F;

    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --tint: #F6F6FB;
    --tint-2: #FAFAFD;
    --chip: #FFE6FA;
    --line: #E8E8F0;
    --line-strong: #D3D3E0;
    --ink: #1A1528;
    --ink-2: #4C4760;
    --ink-3: #6E6984;
    --violet-ink: #A800A8;
    --on-dark: #FFFFFF;
    --on-dark-2: #D7D7FF;
    --on-dark-3: #A9A6C9;
    --sel: #FFF0EA;
    --sel-line: #FF875F;
    --crash: #FFFBE0;

    --done: #1E7A4C;
    --done-bg: #E1F3E8;
    --blocked: #B3261E;
    --blocked-bg: #FBE3E0;

    --font: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --container: 1280px;
    --page-x: clamp(16px, 4vw, 48px);
    --dr-w: 520px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    /* how far the first panel rises into the masthead (its height: --masthead-h, set by the page script) */
    --mast-overlap: 36px;

    --heading: #1C1230; --edge-ink: #1C1230; --badge-bg: #1C1230; --mast: #1C1230;
    --v1-bg: #FFF3FD; --v1-line: #F6C4EE; --band-a: #FFD7FF; --band-c: #E4E4EE; --state-line: #F0A8E6;
    --alert-bg: #FFF8E1; --alert-line: #E0AE00; --building-bg: #FEF6C7; --building: #6B5600; --building-line: #C9A800;
    --review-bg: #FFEDE6; --review: #A3410F; --k-g: #F3F3FA; --k-w: #FFE0FB; --k-w-ink: #8E008E; --k-d: #FFE6D9; --kind-new: #FFE8FC;
    --shadow: rgb(28 18 48 / .45); --shadow-2: rgb(28 18 48 / .5); --tip-shadow: rgb(0 0 0 / .5);
    --on-dark-line: rgb(255 255 255 / .3); --on-dark-edge: rgb(255 255 255 / .18); --on-dark-fill: rgb(255 255 255 / .08);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 15.5px/1.55 var(--font);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    overflow-wrap: break-word;
  }
  .wrap { width: min(100% - 2 * var(--page-x), var(--container)); margin-inline: auto; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; border-radius: 6px; }
  h1, h2, h3 { margin: 0; }
  p { margin: 0; }
  ul, ol { margin: 0; padding: 0; list-style: none; }

  /* ---------- story badge: the one recurring mark ---------- */
  .badge {
    display: inline-grid;
    place-items: center;
    flex: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--badge-bg);
    color: var(--on-dark);
    font: 700 12.5px/1 var(--font);
    font-variant-numeric: tabular-nums;
    transition: background 160ms var(--ease), color 160ms var(--ease);
  }
  .badge.sm { width: 20px; height: 20px; font-size: 11px; }
  .badge.lg { width: 40px; height: 40px; font-size: 18px; }
  /* the chosen story's own mark turns orange; a mark of another story inside a chosen column stays purple */
  .schip.on .badge, .ftl-b.on .badge, .ftl-wl.on .badge, .sl-head.on .sl-hn .badge, .badge.on { background: var(--orange); color: var(--purple); }

  /* ---------- masthead ---------- */
  /* compact, so the flow view and Review fit the window below it: the title on the logo row, the lead at most two
     lines with Read more right after it, then the switch. The title's size comes after the look, in the last
     style block. The page script keeps the masthead's height in --masthead-h on :root. */
  .mast { background: var(--mast); color: var(--on-dark); padding: 12px 0 calc(var(--mast-overlap) + 6px); }
  .mast-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px 18px; }
  .mast-r { display: flex; align-items: center; justify-content: flex-end; gap: 16px; flex-wrap: wrap; }
  /* the views of the page (design-tabs.js): Functional (everything but the drawing and Review), Code Scaffold (only
     the drawing; after the build called Code) and, after the build, Review (only the changes); tabs that look as a switch */
  .views { display: inline-flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--on-dark-fill); border: 1px solid var(--on-dark-edge); }
  .views button { border: 0; background: transparent; color: var(--on-dark-2); cursor: pointer; font: inherit; font-size: 14px; font-weight: 600; line-height: 1; padding: 7px 18px; border-radius: 999px; transition: background 160ms var(--ease), color 160ms var(--ease); }
  .views button:hover { color: var(--on-dark); }
  .views button:is([aria-pressed="true"], [aria-selected="true"]) { background: var(--on-dark); color: var(--purple); }
  .views button:focus-visible { outline: 2px solid var(--lilac); outline-offset: 2px; border-radius: 999px; }
  .view-off { display: none !important; }
  /* Details and ? on the masthead (design-switches.js), small so the masthead keeps its
     height: Details shows the plain words of the intent and the stories (class plain), ? the page's own explanations
     (class how) and the help of the tab under it */
  .mast-sw { display: inline-flex; align-items: center; gap: 8px; }
  .dswitch { display: inline-flex; flex: none; align-items: center; gap: 7px; min-height: 28px; padding: 2px 11px 2px 4px; border: 1px solid var(--on-dark-edge); border-radius: 999px;
    background: var(--on-dark-fill); color: var(--on-dark-2); cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 500; line-height: 1.2; white-space: nowrap;
    transition: background-color 160ms var(--ease), border-color 160ms var(--ease), color 160ms var(--ease); }
  .dswitch:hover { color: var(--on-dark); border-color: var(--on-dark-line); }
  .dswitch-k { position: relative; flex: none; width: 28px; height: 18px; border-radius: 9px; background: rgb(255 255 255 / .22); transition: background-color 160ms var(--ease); }
  .dswitch-k::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--on-dark); transition: translate 160ms var(--ease), background-color 160ms var(--ease); }
  .dswitch[aria-checked="true"] { color: var(--on-dark); }
  .dswitch[aria-checked="true"] .dswitch-k { background: var(--on-dark); }
  .dswitch[aria-checked="true"] .dswitch-k::after { translate: 10px 0; background: var(--purple); }
  .help-btn { display: inline-grid; place-items: center; flex: none; width: 28px; height: 28px; padding: 0; border: 1px solid var(--on-dark-edge); border-radius: 50%;
    background: var(--on-dark-fill); color: var(--on-dark); cursor: pointer; font: inherit; font-size: 14px; font-weight: 700; line-height: 1;
    transition: background-color 160ms var(--ease), border-color 160ms var(--ease), color 160ms var(--ease); }
  .help-btn:hover { border-color: var(--on-dark-line); background: rgb(255 255 255 / .16); }
  .help-btn[aria-pressed="true"], .help-btn[aria-pressed="true"]:hover { border-color: var(--on-dark); background: var(--on-dark); color: var(--purple); }
  :is(.dswitch, .help-btn):focus-visible { outline: 2px solid var(--lilac); outline-offset: 2px; }
  /* the switches at work: Details off hides the plain words, ? off the explanations; never the summary, the legend or a switch */
  .plain-off .plain { display: none !important; }
  :root:not(.help-on) .how { display: none !important; }
  .plain-intent { margin-top: 6px; max-width: 44rem; font-size: 15px; line-height: 1.45; color: var(--on-dark); text-wrap: pretty; }
  .summary.built ~ .plain-intent { max-width: none; }
  /* the help of the tab: under the "?", placed by design-switches.js, in the top layer so nothing clips it */
  .help[hidden] { display: none; }
  .help { position: fixed; z-index: 60; inset: auto; box-sizing: border-box; margin: 0; padding: 0; overflow: visible; border: 1px solid var(--line); border-radius: 16px;
    background: var(--surface); color: var(--ink); font: 400 14px/1.5 var(--font); text-align: left; box-shadow: 0 18px 40px -16px var(--shadow), 0 2px 6px -2px var(--shadow); }
  .help.is-open { display: flex; flex-direction: column; animation: help-in 180ms var(--ease) both; }
  .help:focus { outline: none; }
  .help:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  .help::backdrop { background: transparent; }
  .help.hung::before { content: ""; position: absolute; top: -7px; left: calc(var(--nub, 50%) - 7px); width: 12px; height: 12px; border-top: 1px solid var(--line); border-left: 1px solid var(--line);
    border-top-left-radius: 3px; background: var(--surface); transform: rotate(45deg); }
  .help-head { display: flex; align-items: flex-start; gap: 10px; padding: 14px 10px 4px 18px; }
  .help-t { flex: 1 1 auto; min-width: 0; margin: 4px 0 0; color: var(--heading); font-size: 17px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; text-wrap: balance; }
  .help-x { display: inline-grid; place-items: center; flex: none; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 10px; background: transparent; color: var(--ink-3); cursor: pointer;
    transition: background-color 160ms var(--ease), color 160ms var(--ease); }
  .help-x:hover { background: var(--tint); color: var(--ink); }
  .help-x svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .help-x:focus-visible { outline: 2px solid var(--purple); outline-offset: -2px; }
  .help-list, .help-foot { min-height: 0; }
  .help-list { display: grid; gap: 9px; margin: 0; padding: 6px 18px 14px; list-style: none; overflow: auto; overscroll-behavior: contain; }
  .help-list li { position: relative; padding-left: 16px; color: var(--ink-2); text-wrap: pretty; }
  .help-list li::before { content: ""; position: absolute; left: 1px; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--heading); }
  .help-list b { color: var(--ink); font-weight: 650; }
  .help-foot { display: grid; gap: 4px; padding: 11px 18px 14px; border-top: 1px solid var(--line); border-radius: 0 0 16px 16px; background: var(--tint-2); color: var(--ink-3); font-size: 12.5px; line-height: 1.45; }
  .help-foot p { margin: 0; text-wrap: pretty; }
  .help kbd { display: inline-block; min-width: 1.6em; padding: 0 5px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); color: var(--ink);
    font: 600 12px/1.45 var(--font); text-align: center; white-space: nowrap; }
  @keyframes help-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  /* the flow view: the story chips of the drawing beside the switch, on the masthead, as the switch looks */
  .mast-views { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 24px; margin-top: 12px; }
  .mast-chips { display: none; }
  body.view-tech:not(.view-embed) .mast-chips:not(:empty) { display: grid; gap: 10px; padding-top: 2px; }
  .mast-chips .td-chiprow, .mast-chips .td-chips { margin: 0; }
  .mast-chips .td-dhint { display: none; }
  .mast-chips .td-chip { border-color: var(--on-dark-edge); background: var(--on-dark-fill); color: var(--on-dark); }
  .mast-chips .td-chip:hover { border-color: var(--on-dark-line); background: rgb(255 255 255 / .16); color: var(--on-dark); }
  .mast-chips .td-chip .td-badge { background: var(--on-dark); color: var(--purple); }
  .mast-chips .td-chip.td-on { border-color: var(--on-dark); background: var(--on-dark); color: var(--purple); }
  .mast-chips .td-chip.td-on .td-badge { background: var(--td-orange); color: var(--td-purple); }
  /* the way back to Review (design-tabs.js), beside the switch, only in the flow view after the link to the flow in Review */
  .mast-back { display: none; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px 0 12px; border-radius: 999px; border: 1px solid var(--on-dark-edge); background: var(--on-dark-fill); color: var(--on-dark); cursor: pointer; font: inherit; font-size: 14px; font-weight: 600; line-height: 1; white-space: nowrap; transition: background 160ms var(--ease), border-color 160ms var(--ease); }
  body.view-tech:not(.view-review):not(.view-embed) .mast-back:not([hidden]) { display: inline-flex; }
  .mast-back:hover { border-color: var(--on-dark-line); background: rgb(255 255 255 / .16); }
  .mast-back:focus-visible { outline: 2px solid var(--lilac); outline-offset: 2px; }
  .mast-back svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 160ms var(--ease); }
  .mast-back:hover svg { transform: translateX(-2px); }
  .mast-back-f { min-width: 0; overflow: hidden; text-overflow: ellipsis; padding-left: 8px; border-left: 1px solid var(--on-dark-edge); color: var(--on-dark-2); font-weight: 500; }
  .logo { height: 26px; width: auto; display: block; }
  .phase { font-size: 14px; font-weight: 500; color: var(--on-dark-2); display: inline-flex; align-items: center; gap: 8px; }
  .phase::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--led); }
  /* the title beside the logo, a hairline between them */
  .mast h1 {
    min-width: 0;
    padding-left: 18px;
    border-left: 1px solid var(--on-dark-edge);
    font-weight: 600;
    letter-spacing: -0.024em;
    text-wrap: balance;
  }
  /* the lead: at most two lines, Read more right after its text (the page script cuts a longer lead at a word);
     open, all of it and the rest under it */
  .summary { margin-top: 8px; max-width: 44rem; font-size: 15px; line-height: 1.45; color: var(--on-dark-2); text-wrap: pretty;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .summary.open { display: block; -webkit-line-clamp: none; overflow: visible; }
  /* while the page script measures where the lead ends: no clamp, Read more placed against the lead */
  .summary.fit { position: relative; display: block; -webkit-line-clamp: none; }
  /* after the build what was built takes the masthead's full width: less height above the drawing */
  .summary.built, .summary.built + .rest { max-width: none; }
  .more { display: inline-block; margin-left: 6px; padding: 0; border: 0; background: none; cursor: pointer; white-space: nowrap;
    font: inherit; font-size: 13.5px; color: var(--on-dark-2); text-decoration: underline; text-decoration-color: var(--on-dark-line); text-underline-offset: 3px; }
  .more:hover { color: var(--on-dark); }
  .more[hidden] { display: none; }
  /* the marker drawn, not a glyph: a glyph from a fallback font stands taller than the line and reads as a cut lead */
  .more::before { content: ""; display: inline-block; width: 0; height: 0; margin-right: 6px; vertical-align: 1px;
    border-left: 6px solid var(--lilac); border-block: 4px solid transparent; transition: transform 160ms var(--ease); }
  .more[aria-expanded="true"]::before { transform: rotate(90deg); }
  .rest { margin-top: 4px; max-width: 44rem; font-size: 15px; line-height: 1.45; color: var(--on-dark-3); text-wrap: pretty; }

  /* ---------- cards / sections ---------- */
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 30px clamp(16px, 3vw, 40px) 32px;
  }
  .flowpanel, .view-tech .td-panel { margin-top: calc(-1 * var(--mast-overlap)); box-shadow: 0 18px 40px -24px var(--shadow); }
  section + section { margin-top: 32px; }
  /* the drawing needs room: its panel is wider than the rest of the page */
  .td-panel { --td-w: min(100vw - 2 * var(--page-x), 1960px); width: var(--td-w); margin-inline: calc((100% - var(--td-w)) / 2); padding-inline: clamp(16px, 2vw, 28px); }
  /* the flow view and Review: the masthead and the footer take the drawing's width, so all three share one left edge */
  body.view-tech .mast .wrap, body.view-tech footer.wrap { width: min(100vw - 2 * var(--page-x), 1960px); }
  /* Review: the other view (window.TdReview) fills its box; on a desktop the box is as high as the window has room
     under the masthead (design-tabs.js), elsewhere as high as what it holds. Until it is there, a short word */
  #review-mount { display: flex; flex-direction: column; min-height: 0; }
  #review-mount > * { flex: 1 1 auto; min-height: 0; }
  .rv-wait { display: flex; align-items: center; justify-content: center; margin: 0; padding: 48px 16px; text-align: center; font-size: 15px; color: var(--ink-2); }
  /* the C4 model (design-tabs.js): the v5 page in a frame that fills its box; on a desktop the box
     is as high as the window has room under the masthead, elsewhere a high window of its own */
  .td-embed { padding: 0; overflow: hidden; }
  .td-embed-box { height: min(88vh, 960px); min-height: 420px; }
  .td-embed-box > iframe { display: block; width: 100%; height: 100%; border: 0; }
  .sec-head { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin-bottom: 22px; }
  .sec-head h2 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; color: var(--heading); }
  .explain { max-width: 50rem; margin-top: 2px; font-size: 15.5px; line-height: 1.55; color: var(--ink); text-wrap: pretty; }
  @media (max-width: 400px) { .explain { text-wrap: wrap; } }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 6px; font-size: 14px; color: var(--ink); }
  .legend > span { display: inline-flex; align-items: center; gap: 8px; }
  .legend [data-tip] { cursor: help; text-decoration: underline dotted var(--line-strong); text-underline-offset: 3px; }
  .sw { width: 22px; height: 14px; border-radius: 4px; flex: none; }
  .sw-2 { background: var(--violet); }
  .sw-1 { background: var(--v1-bg); box-shadow: inset 0 0 0 1.5px var(--v1-line); }

  /* ---------- story chips (selector) ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
  .chips:last-child { margin-bottom: 0; }
  .schip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 14px 5px 5px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--tint-2);
    font-size: 13.5px; font-weight: 500; color: var(--ink-2);
    text-align: left;
    cursor: pointer;
    transition: border-color 160ms var(--ease), background 160ms var(--ease);
  }
  .schip:hover { border-color: var(--violet); background: var(--surface); color: var(--ink); }
  .schip.on { border-color: var(--sel-line); background: var(--sel); color: var(--ink); }

  /* ---------- flow diagram ---------- */
  .scroll { overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .flow > svg { display: block; width: 100%; height: auto; }
  .swipe { display: none; font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }
  .lane-bg { fill: var(--tint-2); }
  .lane-vp { fill: var(--tint); }
  .lane-crash { fill: var(--crash); }
  .lane-label { font: 600 13px var(--font); fill: var(--ink-2); }
  .band-a { fill: var(--band-a); }
  .band-b { fill: var(--violet); }
  .band-t { font: 600 10.5px var(--font); letter-spacing: .02em; }
  .band-ta { fill: var(--heading); }
  .band-tb { fill: var(--on-dark); }
  .band-c { fill: var(--band-c); }
  .band-tc { fill: var(--ink-2); }
  .band-end { font: 500 11px var(--font); fill: var(--violet-ink); }
  .fnode { cursor: default; transition: opacity 200ms var(--ease); }
  .fnode rect { fill: var(--surface); stroke: var(--edge-ink); stroke-width: 1.4; transition: stroke 200ms var(--ease); }
  .fnode.state rect { fill: var(--surface); stroke: var(--state-line); }
  .fnode.alert rect { fill: var(--surface); stroke: var(--alert-line); }
  .fnode .nl { font: 600 14px var(--font); fill: var(--ink); }
  .fnode .ns { font: 400 11.5px var(--font); fill: var(--ink-3); }
  .fnode.on rect { stroke: var(--orange); stroke-width: 2.6; }
  .fedge path { fill: none; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; transition: opacity 200ms var(--ease); }
  .fedge.main path, .fedge.loop path { stroke: var(--edge-ink); }
  .fedge.write path { stroke: var(--violet); }
  .fedge.reject path { stroke: var(--ink-3); stroke-dasharray: 4 4; stroke-width: 1.3; }
  .fedge.crash path { stroke: var(--ink-2); stroke-dasharray: 6 4; }
  .fedge text { font: 500 11.5px var(--font); fill: var(--ink-2); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
  .fedge.write text { fill: var(--violet-ink); }
  .fedge .bolt { fill: var(--yellow); stroke: var(--purple); stroke-width: 1; stroke-linejoin: round; stroke-dasharray: none; }
  .nbadge { cursor: pointer; }
  .nbadge circle { fill: var(--badge-bg); stroke: var(--surface); stroke-width: 2; transition: fill 160ms var(--ease); }
  .nbadge text { font: 700 11px var(--font); fill: var(--on-dark); font-variant-numeric: tabular-nums; pointer-events: none; }
  .nbadge.on circle { fill: var(--orange); }
  .nbadge.on text { fill: var(--purple); }
  .fwrap rect.frame { fill: none; stroke: var(--violet); stroke-width: 1.5; stroke-dasharray: 7 5; transition: stroke 200ms var(--ease); }
  .fwrap .wl { cursor: pointer; }
  .fwrap .wl rect { fill: var(--surface); stroke: var(--violet); stroke-width: 1.5; }
  .fwrap .wl circle { fill: var(--badge-bg); }
  .fwrap .wl .wn { font: 700 11px var(--font); fill: var(--on-dark); }
  .fwrap .wl .wt { font: 600 12.5px var(--font); fill: var(--heading); }
  .fwrap.on rect.frame { stroke: var(--orange); stroke-width: 2.4; stroke-dasharray: none; }
  .fwrap.on .wl rect { stroke: var(--orange); fill: var(--sel); }
  .flow.active .fnode:not(.on) { opacity: .28; }
  .flow.active .fedge { opacity: .3; }
  .flow.active.all .fnode, .flow.active.all .fedge { opacity: 1; }

  /* ---------- the lifecycle top to bottom, for a box too narrow for the lanes (phone, tablet): the status band
     turns into the rail on the left, each step a card that says who does it and which stories build it ---------- */
  .ftl { display: none; }
  .flow.tl > svg { display: none; }
  .flow.tl .ftl { display: block; }
  .flow.more-r { -webkit-mask-image: linear-gradient(to left, transparent, #000 48px); mask-image: linear-gradient(to left, transparent, #000 48px); }
  /* lanes scrolled sideways keep their names at the left edge, each on a piece of its own plate (no fade over them) */
  .lane-pins { display: none; }
  .flow.more-l .lane-pins { display: inline; }
  .pin-bg { fill: var(--tint-2); }
  .pin-vp { fill: var(--tint); }
  .pin-crash { fill: var(--crash); }
  .pf-bg { stop-color: var(--tint-2); }
  .pf-vp { stop-color: var(--tint); }
  .pf-crash { stop-color: var(--crash); }
  .flow .ftl svg { display: inline-block; width: 16px; min-width: 0; height: 16px; flex: none; }
  .ftl-list { display: grid; gap: 10px; }
  .ftl-list > li { position: relative; padding-left: 30px; }
  .ftl-list > li::before { content: ""; position: absolute; left: 10px; top: 0; bottom: -10px; width: 4px; background: var(--rail); }
  .ftl-list > li:first-child::before { top: 12px; border-radius: 2px 2px 0 0; }
  .ftl-list > li:last-child::before { bottom: auto; height: 22px; border-radius: 0 0 2px 2px; }
  .ftl-list > li { --rail: var(--line); }
  .ftl-list > .r-a { --rail: var(--band-a); }
  .ftl-list > .r-b { --rail: var(--violet); }
  .ftl-list > .r-c { --rail: var(--band-c); }
  .ftl-st { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 2px 0; }
  .ftl-list > .ftl-st { padding-left: 0; }
  .ftl-st b { position: relative; z-index: 1; padding: 3px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; line-height: 1.35; }
  .ftl-st.r-a b { background: var(--band-a); color: var(--heading); }
  .ftl-st.r-b b { background: var(--violet); color: var(--on-dark); }
  .ftl-st.r-c b { background: var(--band-c); color: var(--ink-2); }
  .ftl-st span { font-size: 13px; line-height: 1.4; color: var(--ink-3); }
  .ftl-list > .ftl-end { padding-left: 0; }
  .ftl-end b { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--violet-ink); }
  .ftl-end b::before { content: ""; width: 0; height: 0; border-style: solid; border-width: 10px 12px 0; border-color: var(--rail) transparent transparent; }
  .ftl-list > li.ftl-end::before { bottom: 50%; height: auto; }
  .ftl-step::after { content: ""; position: absolute; left: 6px; top: 16px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 2px var(--edge-ink); }
  .ftl-step.state::after { box-shadow: 0 0 0 2px var(--state-line); }
  .ftl-step.alert::after { background: var(--alert-bg); box-shadow: 0 0 0 2px var(--alert-line); }
  .ftl-card { padding: 10px 12px 11px; border: 1.4px solid var(--edge-ink); border-radius: 10px; background: var(--surface); transition: opacity 200ms var(--ease), border-color 200ms var(--ease), box-shadow 200ms var(--ease); }
  .ftl-step.state .ftl-card { border-color: var(--state-line); border-radius: 18px; }
  .ftl-step.alert .ftl-card { border-color: var(--alert-line); background: var(--alert-bg); }
  .ftl-top { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px; min-height: 24px; }
  .ftl-lane { display: inline-block; padding: 2px 9px; border-radius: 6px; background: var(--tint-2); box-shadow: inset 0 0 0 1px var(--line-strong); font-size: 12px; font-weight: 600; line-height: 1.5; color: var(--ink-2); }
  .ftl-lane.l-strong { background: var(--tint); box-shadow: none; color: var(--heading); }
  .ftl-lane.l-alert { background: var(--crash); box-shadow: inset 0 0 0 1px var(--alert-line); color: var(--building); }
  .ftl-ids { display: flex; margin: -8px -8px -8px auto; }
  .ftl-b { display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; }
  /* the tap areas overlap a little, so three badges stay on the row of the lane name */
  .ftl-b + .ftl-b { margin-left: -10px; }
  .ftl-in { display: flex; align-items: flex-start; gap: 6px; margin-top: 8px; font-size: 13px; line-height: 1.4; color: var(--ink-2); }
  .ftl-in b { font-weight: 600; color: var(--ink); }
  .ftl-in + .ftl-in { margin-top: 3px; }
  .ftl-ic { width: 16px; height: 16px; margin-top: 1px; fill: none; stroke: var(--edge-ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .ftl-in.write .ftl-ic { stroke: var(--violet); }
  .ftl-in.reject .ftl-ic { stroke: var(--ink-3); stroke-dasharray: 2.4 2.4; }
  .ftl-in.crash .ftl-ic { fill: var(--yellow); stroke: var(--purple); stroke-width: 1; }
  .ftl-name { margin-top: 6px; font-size: 15px; font-weight: 600; line-height: 1.3; color: var(--ink); }
  .ftl-sub { margin-top: 2px; font-size: 13.5px; line-height: 1.45; color: var(--ink-3); }
  .ftl-frame { position: relative; margin-top: 22px; padding: 30px 10px 12px; border: 1.5px dashed var(--violet); border-radius: 16px; transition: border-color 200ms var(--ease); }
  .ftl-wl { position: absolute; top: -21px; left: 12px; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; max-width: calc(100% - 24px); padding: 4px 14px 4px 8px; border: 1.5px solid var(--violet); border-radius: 999px; background: var(--surface); font-size: 13.5px; font-weight: 600; color: var(--heading); text-align: left; cursor: pointer; }
  .ftl-wt { margin: 0 0 12px; font-size: 13px; line-height: 1.45; color: var(--ink-2); }
  .ftl-frame.on { border-style: solid; border-color: var(--orange); }
  .ftl-frame.on .ftl-wl { border-color: var(--orange); background: var(--sel); }
  .ftl-step.on .ftl-card { border-color: var(--orange); box-shadow: 0 0 0 1.2px var(--orange); }
  .flow.active .ftl-step:not(.on) .ftl-card { opacity: .4; }
  .flow.active.all .ftl-step .ftl-card { opacity: 1; }

  /* ---------- slice chart: stories along the x-axis at the bottom, system layers up the y-axis on the left ---------- */
  .grid-scroll { overflow-x: auto; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  table.mx { border-collapse: separate; border-spacing: 0; min-width: 100%; }
  .mx th, .mx td { padding: 0; }
  .mx tbody tr { height: 40px; }
  .mx tbody tr + tr > * { border-top: 1px solid var(--line); }
  .mx tbody tr + tr > th { border-top-color: transparent; }
  .mx tbody tr.gsep > * { border-top: 1.5px solid var(--line-strong) !important; }
  .mx td.c { min-width: 84px; width: 84px; padding: 4px 18px; cursor: pointer; transition: background-color 140ms var(--ease); }
  .blk { display: block; height: 30px; border-radius: 6px; transition: opacity 200ms var(--ease); }
  .v2 .blk { background: var(--violet); }
  .v1 .blk { background: var(--v1-bg); box-shadow: inset 0 0 0 1.5px var(--v1-line); }
  .mx td.sstart { border-left: 1.5px dashed var(--line-strong); }
  .mx .yg { position: sticky; left: 0; z-index: 1; width: 28px; min-width: 28px; background: var(--surface); }
  .mx .yg span { display: inline-block; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11.5px; font-weight: 600; letter-spacing: .04em; color: var(--ink-3); }
  .mx .yl { position: sticky; left: 28px; z-index: 1; width: 136px; min-width: 136px; padding: 0 14px 0 4px; background: var(--surface); border-right: 1.5px solid var(--ink-3); text-align: right; font-size: 13px; font-weight: 500; color: var(--ink-2); white-space: nowrap; cursor: help; }
  .mx .ycorner { position: sticky; left: 0; z-index: 1; background: var(--surface); }
  .mx tr.xaxis td { padding: 10px 2px 4px; border-top: 1.5px solid var(--ink-3); vertical-align: top; text-align: center; }
  .mx tr.xaxis .ycorner { border-right: 1.5px solid var(--ink-3); }
  .xbtn { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; padding: 6px 2px 8px; border: 0; border-radius: 10px; background: none; cursor: pointer; transition: background-color 140ms var(--ease); }
  .xbtn .xn {
    font-size: 11.5px; font-weight: 500; line-height: 1.25; color: var(--ink-2);
    hyphens: manual; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
  }
  .xbtn:hover .xn { color: var(--violet-ink); }
  .mx tr.xstage td { padding: 12px 8px 0; text-align: center; font-size: 12px; font-weight: 600; color: var(--ink-3); }
  .mx tr.xstage td span { display: block; padding-top: 6px; border-top: 1.5px solid var(--line-strong); }
  .mx td.c.on, .mx td.xs.on .xbtn { background-color: var(--sel); }
  .mx.active td.c:not(.on) .blk { opacity: .3; }

  /* ---------- integration tests: stories per build step, one arrow per test ---------- */
  .itests svg { display: block; width: 100%; min-width: 880px; height: auto; }
  .tnode { cursor: pointer; transition: opacity 200ms var(--ease); }
  .tnode rect { fill: var(--surface); stroke: var(--edge-ink); stroke-width: 1.4; transition: fill 160ms var(--ease), stroke 160ms var(--ease); }
  .tnode:hover rect { fill: var(--tint-2); }
  .tnode .tbc { fill: var(--badge-bg); transition: fill 160ms var(--ease); }
  .tnode .tbt { font: 700 11.5px var(--font); fill: var(--on-dark); text-anchor: middle; font-variant-numeric: tabular-nums; pointer-events: none; }
  .tnode .tl { font: 600 14px var(--font); fill: var(--ink); pointer-events: none; }
  .tnode.on rect { fill: var(--sel); stroke: var(--orange); stroke-width: 2.6; }
  .tnode.on .tbc { fill: var(--orange); }
  .tnode.on .tbt { fill: var(--purple); }
  .tnode.rel rect { stroke-width: 2.2; }
  .tedge { cursor: pointer; transition: opacity 200ms var(--ease); }
  .tedge .hit { fill: none; stroke: transparent; stroke-width: 14; }
  .tedge .ln { fill: none; stroke: var(--violet); stroke-width: 1.6; stroke-linecap: round; transition: stroke 160ms var(--ease), stroke-width 160ms var(--ease); }
  .tedge .ah { fill: var(--violet); transition: fill 160ms var(--ease); }
  .tedge.on .ln { stroke: var(--edge-ink); stroke-width: 2.6; }
  .tedge.on .ah { fill: var(--edge-ink); }
  .itests.active .tnode:not(.on):not(.rel) { opacity: .3; }
  .itests.active .tedge:not(.on) { opacity: .14; }
  .taxis line { stroke: var(--ink-3); stroke-width: 1.5; }
  .taxis text { font: 600 12.5px var(--font); fill: var(--ink-3); text-anchor: middle; }
  .tkey { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 6px; font-size: 14px; color: var(--ink); }
  .tkey svg { display: block; flex: none; }
  .tkey .kb { fill: var(--surface); stroke: var(--edge-ink); stroke-width: 1.4; }
  .tkey .kt { font: 600 12.5px var(--font); fill: var(--ink); }

  /* ---------- out of scope: one compact row ---------- */
  .scope-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; padding: 4px 0 0; }
  .scope-row h2 { font-size: 14px; font-weight: 600; color: var(--ink-3); }
  .scope-row ul { display: flex; flex-wrap: wrap; gap: 8px; }
  .scope-row li { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--ink-2); }
  .scope-row li[data-tip] { cursor: help; }

  /* one quiet row with the date */
  footer { margin: 28px auto 40px; font-size: 13px; color: var(--ink-3); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 24px; }

  /* ---------- drawer ---------- */
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 30;
    width: min(var(--dr-w), 100vw);
    background: var(--surface);
    border-left: 1px solid var(--line);
    box-shadow: -24px 0 48px -28px var(--shadow-2);
    transform: translateX(102%);
    transition: transform 280ms var(--ease);
    display: flex; flex-direction: column;
    visibility: hidden;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .drawer.open { transform: none; visibility: visible; }
  .scrim { position: fixed; inset: 0; z-index: 29; background: rgb(18 10 32 / .38); opacity: 0; visibility: hidden; transition: opacity 280ms var(--ease), visibility 0s 280ms; -webkit-tap-highlight-color: transparent; }
  /* a wide screen makes room for the side panel, so what a chosen story lights up stays in sight */
  @media (min-width: 1100px) {
    body.sheet-open:not(.view-tech) :is(main.wrap, .mast .wrap, footer.wrap) {
      width: min(100% - 2 * var(--page-x) - var(--dr-w), var(--container));
      margin-left: max(var(--page-x), (100% - var(--dr-w) - var(--container)) / 2);
      margin-right: 0;
    }
    body.sheet-open:not(.view-tech) #sec-slices.sl-wide { width: auto; margin-inline: 0; }
  }
  /* a narrower screen: the panel lies over the page, which dims, and a tap beside it closes it */
  @media (max-width: 1099.98px) {
    body.sheet-open .scrim { opacity: 1; visibility: visible; transition: opacity 280ms var(--ease); }
  }
  .dr-head { display: flex; align-items: center; gap: 14px; padding: 22px 24px 18px; border-bottom: 1px solid var(--line); }
  .dr-t { flex: 1; min-width: 0; }
  .dr-t h3 { font-size: 1.1875rem; font-weight: 600; line-height: 1.25; color: var(--heading); text-wrap: balance; }
  .st { display: inline-flex; align-items: center; gap: 7px; margin-top: 7px; padding: 0 10px 0 8px; border-radius: 999px; background: var(--tint-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); font-size: 12px; font-weight: 600; line-height: 22px; }
  .st-done { background: var(--done-bg); box-shadow: none; color: var(--done); }
  .st-building { background: var(--building-bg); box-shadow: none; color: var(--building); }
  .st-review { background: var(--review-bg); box-shadow: none; color: var(--review); }
  .st-blocked { background: var(--blocked-bg); box-shadow: none; color: var(--blocked); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--ink-3); }
  .dot-done { background: var(--done); box-shadow: none; }
  .dot-building { background: var(--yellow); box-shadow: 0 0 0 1.5px var(--building-line); }
  .dot-review { background: var(--orange); box-shadow: none; }
  .dot-blocked { background: var(--blocked); box-shadow: none; }
  .dr-nav { margin-left: auto; display: flex; gap: 6px; flex: none; }
  .ib { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; color: var(--ink-2); }
  .ib:hover { border-color: var(--violet); color: var(--heading); background: var(--tint-2); }
  .ib.close span { display: none; }
  .ib:disabled { opacity: .35; cursor: default; }
  .ib svg { width: 16px; height: 16px; }
  .dr-body { overflow-y: auto; padding: 4px 24px 40px; overscroll-behavior: contain; }
  .dr-sec { margin-top: 28px; }
  .dr-sec.first { margin-top: 18px; }
  .dr-h { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--heading); }
  .us, .why { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--ink-2); text-wrap: pretty; }
  .us b { font-weight: 600; color: var(--violet-ink); }
  .acs { display: grid; gap: 8px; }
  .gwt { padding: 10px 12px; border-radius: 10px; background: var(--tint-2); font-size: 13.5px; line-height: 1.7; }
  .k { display: inline-block; margin: 0 2px; padding: 0 7px; border-radius: 6px; font-size: 11.5px; font-weight: 600; line-height: 18px; white-space: nowrap; vertical-align: 1px; }
  .k-g { background: var(--k-g); color: var(--heading); }
  .k-w { background: var(--k-w); color: var(--k-w-ink); }
  .k-d { background: var(--k-d); color: var(--review); }
  .code-mod + .code-mod { margin-top: 14px; }
  .code-m { margin-bottom: 6px; font-size: 12px; font-weight: 500; color: var(--ink-3); }
  .code-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .code-item { display: inline-flex; align-items: center; gap: 8px; padding: 4px 5px 4px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: help; }
  .code-item:hover, .code-item:focus-visible { border-color: var(--line-strong); }
  .cname { font: 500 12.5px/1.4 var(--mono); color: var(--ink); overflow-wrap: anywhere; }
  .kind { flex: none; padding: 0 7px; border-radius: 5px; font-size: 11px; font-weight: 600; line-height: 19px; }
  /* the same words and colours as the slices: new, changes */
  .kind.new { background: var(--violet-ink); color: var(--surface); }
  .kind.changes { background: var(--building); color: var(--surface); }
  .code-more { margin-top: 12px; font-size: 12.5px; color: var(--ink-3); }
  .int-g + .int-g { margin-top: 18px; }
  .int-h { margin-bottom: 8px; font-size: 12.5px; font-weight: 500; color: var(--ink-3); }
  .ents { display: grid; gap: 8px; }
  .ent { padding: 10px 12px 11px; border: 1px solid var(--line); border-radius: 10px; }
  .ent.hit { border-color: var(--sel-line); background: var(--sel); }
  .ent-chip { display: inline-flex; align-items: center; gap: 8px; padding: 3px 12px 3px 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--tint-2); font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; transition: border-color 140ms var(--ease), background 140ms var(--ease); }
  .ent-chip:hover { border-color: var(--violet); background: var(--surface); }
  .ent-line { margin-top: 7px; font-size: 13.5px; line-height: 1.5; color: var(--ink-2); }

  /* test cases (construction): one card per test case, the steps folded away */
  .tcs { display: grid; gap: 8px; }
  .tc { border: 1px solid var(--line); border-radius: 10px; }
  .tc > summary { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; cursor: pointer; list-style: none; font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .tc > summary::-webkit-details-marker { display: none; }
  .tc > summary::before { content: ""; flex: none; width: 6px; height: 6px; margin: 0 2px 0 1px; border-right: 1.6px solid var(--ink-3); border-bottom: 1.6px solid var(--ink-3); transform: rotate(-45deg); transition: transform 160ms var(--ease); }
  .tc[open] > summary::before { transform: rotate(45deg); }
  .tc > summary:hover { background: var(--tint-2); }
  .tc-t { flex: 1; min-width: 0; }
  .twin { flex: none; padding: 0 7px; border-radius: 5px; background: var(--chip); color: var(--ink-2); font-size: 11px; font-weight: 600; line-height: 19px; }
  .twin.passed { background: var(--done-bg); color: var(--done); }
  .twin.failed { background: var(--blocked-bg); color: var(--blocked); }
  .tc-b { padding: 0 14px 14px 30px; font-size: 13.5px; line-height: 1.6; color: var(--ink-2); }
  .tc-b h5 { margin: 12px 0 4px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
  .tc-b h5:first-child { margin-top: 2px; }
  .tc-b p + p { margin-top: 6px; }
  .tc-b ol { list-style: decimal; padding-left: 20px; }
  .tc-b ul { list-style: disc; padding-left: 20px; }
  .tc-b li + li { margin-top: 3px; }
  .tc-b li > ul, .tc-b li > ol { margin-top: 3px; }
  .tc-b code { font: 500 12px/1.4 var(--mono); padding: 0 4px; border-radius: 4px; background: var(--tint-2); color: var(--ink); overflow-wrap: anywhere; }
  .tc-b table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tc-b th, .tc-b td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  .tc-b th { font-weight: 600; color: var(--ink-2); }

  /* ---------- tooltip ---------- */
  .tip {
    position: fixed; z-index: 40; max-width: 320px;
    padding: 9px 12px; border-radius: 10px;
    background: var(--purple); color: var(--on-dark);
    font-size: 13px; line-height: 1.45; white-space: pre-line;

  @media (max-width: 760px) {

<script>/*__DESIGN_JS__*/</script>
<script id="overview-data" type="application/json">__OVERVIEW_DATA__</script>
<script>
(() => {
  'use strict';
  const D = JSON.parse(document.getElementById('overview-data').textContent);
  document.documentElement.lang = D.lang || 'en';
  // every fixed text of the page, from the string table in the turbo-text block (design-text.js)
  const TT = (key, vars) => window.TdText.t('overview.' + key, vars);
  const MD = (key) => window.TdText.t('md.' + key);
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (id) => { const n = parseInt(id, 10); return esc(Number.isNaN(n) ? id : n); };
  const plain = (t) => String(t ?? '').replace(/­/g, '');
  const LB = D.labels || {};
  const intent = D.intent || {};
  // after the build the page says what happened, before it what will happen
  const afterBuild = D.phase === 'construction';
  const statusLabel = (st) => (LB.storyStatus || {})[st] || st || '';
  // soft hyphens in a long word, so a narrow column breaks it the way Dutch and English do:
  // between syllables, a consonant cluster split so the next syllable starts with a valid onset
  const ONSETS = new Set('bl br ch chr dr dw fl fr gl gr kl kn kr kw pl pr sch schr sj sk sl sm sn sp spl spr st str sw th tr tw vl vr wr zw'.split(' '));
  const hyphenate = (text) => plain(text).replace(/[A-Za-zÀ-ÿ]{10,}/g, (w) => {
    const lw = w.toLowerCase();
    const isV = (i) => /[aeiouyàáâäèéêëìíîïòóôöùúûü]/.test(lw[i]) || (lw[i] === 'j' && lw[i - 1] === 'i');
    const cuts = [];
    let i = 0;
    while (i < lw.length && !isV(i)) i++;
    while (i < lw.length) {
      while (i < lw.length && isV(i)) i++;
      const c0 = i;
      while (i < lw.length && !isV(i)) i++;
      if (i >= lw.length) break;
      const cl = lw.slice(c0, i);
      let k = cl.length - 1;
      for (let n = Math.min(4, cl.length - 1); n >= 2; n--) if (ONSETS.has(cl.slice(-n))) { k = cl.length - n; break; }
      cuts.push(c0 + k);
    }
    let out = '', last = 0;
    cuts.filter((c) => c >= 2 && w.length - c >= 3).forEach((c) => { out += w.slice(last, c) + '\u00ad'; last = c; });
    return out + w.slice(last);
  });

  /* a name keeps its long words whole: a word too wide for the room beside its chip moves the name under the chip,
     and only a word wider than the whole card gets the soft hyphens. Measured in the font the name shows in, again
     when its box changes width or the web font comes in */
  const fitMeasure = document.createElement('canvas').getContext('2d');
  const fitNames = (root) => $$('[data-name]', root).forEach((el) => {
    const row = el.parentElement, name = el.dataset.name, full = row.clientWidth;
    if (!full) return; // not shown
    const chip = el.previousElementSibling;
    const beside = full - (chip ? chip.offsetWidth + (parseFloat(getComputedStyle(row).columnGap) || 0) : 0);
    const cs = getComputedStyle(el);
    fitMeasure.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const widthOf = (word) => fitMeasure.measureText(word).width;
    const widest = Math.max(0, ...(name.match(/[A-Za-zÀ-ÿ]{6,}/g) || []).map(widthOf));
    const stack = row.classList.contains('sl-cn') && widest > beside + 0.5;
    row.classList.toggle('stack', stack);
    const room = stack ? full : beside;
    const out = name.replace(/[A-Za-zÀ-ÿ]{6,}/g, (word) => (widthOf(word) > room + 0.5 ? hyphenate(word) : word));
    if (el.textContent !== out) el.textContent = out;
  });
  const nameSpan = (text) => `<span data-name="${esc(plain(text))}">${esc(plain(text))}</span>`;
  /* code names that break only where a reader expects it: after , _ / . and between the words of a CamelCase name */
  const codeLines = (text) => String(text || '').split(/,\s*/).filter(Boolean)
    .map((n) => `<span>${esc(n).replace(/([_/.])(?=\S)/g, '$1<wbr>').replace(/([a-z0-9])(?=[A-Z])/g, '$1<wbr>')}</span>`).join('');

  /* ---------- order: build stages from depends_on ---------- */
  const stories = (D.stories || []).filter((s) => s && s.id);
  const byId = new Map(stories.map((s) => [s.id, s]));
  const stageOf = {};
  const stage = (id, seen = new Set()) => {
    if (stageOf[id]) return stageOf[id];
    if (seen.has(id)) return 1;
    seen.add(id);
    const deps = (byId.get(id).depends_on || []).filter((d) => byId.has(d));
    stageOf[id] = 1 + (deps.length ? Math.max(...deps.map((d) => stage(d, seen))) : 0);
    return stageOf[id];
  };
  stories.forEach((s) => stage(s.id));
  const order = [...stories].sort((a, b) => stageOf[a.id] - stageOf[b.id] || a.id.localeCompare(b.id));
  const idx = new Map(order.map((s, i) => [s.id, i]));
  const titleOf = (id) => byId.get(id).title || id;
  const shortOf = (id) => byId.get(id).short || titleOf(id);
  const storyTip = (id) => `<span class="muted">${num(id)}</span> ${esc(titleOf(id))}`;

  const tests = (D.integration || []).filter((t) => t && byId.has(t.later) && byId.has(t.earlier) && t.later !== t.earlier);
  tests.forEach((t, i) => { if (!t.id) t.id = 'T' + (i + 1); });
  const LC = D.lifecycle && (D.lifecycle.nodes || []).length && (D.lifecycle.lanes || []).length ? D.lifecycle : null;
  const layerList = (D.layers || []).filter((l) => l && l.id);

  /* ---------- tooltip ---------- */
  const TIPS = new Map();
  let tipN = 0;
  const tipAttr = (html) => { const k = 't' + (++tipN); TIPS.set(k, html); return `data-tip="${k}"`; };
  const tip = document.createElement('div');
  tip.className = 'tip';
  tip.setAttribute('role', 'tooltip');
  document.body.append(tip);
  let tipEl = null;
  const showTip = (el, ev) => {
    const html = TIPS.get(el.getAttribute('data-tip'));
    if (!html) return;
    tipEl = el;
    tip.innerHTML = html;
    tip.classList.add('show');
    let r = el.getBoundingClientRect();
    if (el.dataset.tipAt === 'graph') {
      // an arrow in the test graph: under the graph (or above it), at the pointer, so the tip never covers a story box
      const g = (el.closest('.itests') || el).getBoundingClientRect(), x = ev ? ev.clientX : r.left + r.width / 2;
      r = { left: x, right: x, width: 0, top: g.top, bottom: g.bottom };
    }
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = r.left + r.width / 2 - tw / 2;
    x = Math.max(8, Math.min(x, window.innerWidth - tw - 8));
    let y = r.bottom + 8;
    if (y + th > window.innerHeight - 8) y = r.top - th - 8;
    tip.style.left = x + 'px';
    tip.style.top = Math.max(8, y) + 'px';
  };
  const hideTip = () => { tipEl = null; tip.classList.remove('show'); };
  // a finger has no hover: the hover effects wait for a mouse, and a tap on something that only explains
  // itself shows its tip, until a second tap or a tap elsewhere
  let touch = false;
  document.addEventListener('pointerdown', (e) => { touch = e.pointerType === 'touch'; }, true);
  document.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') touch = false; }, true);
  document.addEventListener('click', (e) => {
    if (!touch) return;
    const el = e.target.closest('[data-tip]');
    if (el && el !== tipEl && !el.closest('button, a, summary, [data-story], [data-t], [data-switch], [role="button"]')) showTip(el); else hideTip();
  });
  document.addEventListener('mouseover', (e) => { if (touch) return; const el = e.target.closest('[data-tip]'); if (el && el !== tipEl) showTip(el, e); else if (!el && tipEl) hideTip(); });
  document.addEventListener('focusin', (e) => { if (touch) return; const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
  document.addEventListener('focusout', hideTip);
  window.addEventListener('scroll', hideTip, { passive: true });

  /* an SVG label that is longer than its box ends in an ellipsis; rerun once the web font is in */
  const fitLabels = () => $$('text[data-fit]').forEach((t) => {
    const full = t.dataset.full ?? (t.dataset.full = t.textContent);
    const max = +t.dataset.fit;
    t.textContent = full;
    if (!t.getComputedTextLength || t.getComputedTextLength() <= max) return;
    let n = full.length;
    while (n > 1 && t.getComputedTextLength() > max) t.textContent = full.slice(0, --n).trimEnd() + '…';
  });

  /* ---------- masthead ---------- */
  document.title = plain(intent.title) || document.title;
  $('#phase').textContent = (LB.phase || {})[D.phase] || '';
  // after the build the masthead says what the intent built, in the words finish wrote into the brief (built);
  // without them the intent's own summary, never the drawing's: that is the design, not what was built
  const asBuilt = D.phase === 'construction' && D.design && D.design.build;
  $('#title').textContent = plain(intent.title);
  const lead = (afterBuild && intent.built) || intent.summary;
  $('#title').classList.toggle('built', !!asBuilt);
  // under a built lead, Read more holds the whole intent
  const rest = lead === intent.summary ? intent.rest : [intent.summary, intent.rest].filter(Boolean).join(' ');
  const sum = $('#summary'), leadEl = $('#lead'), more = $('#more'), restEl = $('#rest');
  if (LB.more) more.textContent = LB.more;
  if (rest) restEl.textContent = rest;
  if (!lead && !rest) { sum.remove(); restEl.remove(); } else {
    sum.classList.toggle('built', !!asBuilt);
    // the lead at most two lines, Read more right after it: a lead too long is cut at a word, with an ellipsis,
    // so Read more still fits; Read more only with a rest or a cut lead; open, the whole lead and the rest
    let open = false, wasCut = false, fitW = -1;
    // cut: Read more (without it, the lead's own end) lies under the second line, measured without the clamp,
    // by the line Read more sits on: never by its tap area, which reaches past the line on a phone
    const cut = () => {
      sum.classList.add('fit');
      const lh = parseFloat(getComputedStyle(sum).lineHeight);
      const over = more.hidden ? sum.clientHeight > 2 * lh + 1 : more.offsetTop + more.offsetHeight / 2 > 2 * lh;
      sum.classList.remove('fit');
      return over;
    };
    const fitLead = () => {
      leadEl.textContent = lead || '';
      more.hidden = !rest && !open; // without a rest, first the lead alone
      wasCut = !open && cut();
      if (wasCut) {
        more.hidden = false;
        const words = (lead || '').split(' ');
        let lo = 0, hi = words.length - 1;
        while (lo < hi) {
          const mid = (lo + hi + 1) >> 1;
          leadEl.textContent = words.slice(0, mid).join(' ') + '\u2026';
          if (cut()) hi = mid - 1; else lo = mid;
        }
        leadEl.textContent = words.slice(0, lo).join(' ') + '\u2026';
      }
      more.hidden = !rest && !open && !wasCut;
    };
    more.addEventListener('click', () => {
      open = !open;
      more.setAttribute('aria-expanded', String(open));
      sum.classList.toggle('open', open);
      restEl.hidden = !open || !rest;
      fitLead();
    });
    const onWidth = () => { if (sum.clientWidth !== fitW) { fitW = sum.clientWidth; fitLead(); } };
    if (window.ResizeObserver) new ResizeObserver(onWidth).observe(sum); else window.addEventListener('resize', onWidth);
    if (document.fonts) document.fonts.ready.then(fitLead);
    onWidth();
  }
  // under the summary the intent in plain words (Details, design-switches.js): after the build what it built when the
  // lead does not already say that, else the record's plain text; the summary and Read more stay whatever the switch
  const said = [afterBuild && intent.built, intent.plain].find((t) => t && t !== lead);
  if (said) $('#plain-intent').textContent = plain(said); else $('#plain-intent').remove();
  // the masthead's own height on :root, for the flow view and Review to fit the window below it
  const mast = $('.mast');
  const mastH = () => document.documentElement.style.setProperty('--masthead-h', `${Math.ceil(mast.getBoundingClientRect().height)}px`);
  if (window.ResizeObserver) new ResizeObserver(mastH).observe(mast); else window.addEventListener('resize', mastH);
  mastH();
  const X = LB.explain || {};
  [['#x-flow', LC && X.flow], ['#x-slices', X.slices], ['#x-tests', X.tests]].forEach(([sel, txt]) => { if (txt) $(sel).textContent = txt; else $(sel).remove(); });
  const CELL = LB.cell || {};
  $('#foot-at').textContent = D.generated ? TT('updated', { at: D.generated }) : '';

  /* ---------- story chips ---------- */
  $('#chips').innerHTML = order.map((s) =>
    `<button class="schip" role="listitem" data-story="${esc(s.id)}" data-hover ${tipAttr(storyTip(s.id))}><span class="badge sm">${num(s.id)}</span>${esc(shortOf(s.id))}</button>`).join('');

  /* ---------- flow diagram ---------- */
  // text is measured in the page font, so a name wraps where it really runs out of room
  const measure = document.createElement('canvas').getContext('2d');
  const FONT = getComputedStyle(document.documentElement).getPropertyValue('--font').trim() || 'sans-serif';
  const textW = (t, font) => { measure.font = font + ' ' + FONT; return measure.measureText(t).width; };
  /* the break of a text into at most k lines that keeps the longest line shortest: { lines, w } */
  const balance = (text, font, k) => {
    const words = String(text || '').split(/\s+/).filter(Boolean);
    const width = (a, b) => textW(words.slice(a, b).join(' '), font);
    const split = (from, k) => {
      let best = { lines: [words.slice(from).join(' ')], w: width(from, words.length) };
      for (let i = from + 1; k > 1 && i < words.length; i++) {
        const head = width(from, i);
        if (head >= best.w) break;
        const rest = split(i, k - 1);
        if (Math.max(head, rest.w) < best.w) best = { lines: [words.slice(from, i).join(' '), ...rest.lines], w: Math.max(head, rest.w) };
      }
      return best;
    };
