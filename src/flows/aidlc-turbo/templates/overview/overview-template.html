      const ins = (LC.edges || []).filter((e) => e.to === n.id && e.from !== n.id && nameOf.has(e.from)).map((e) => {
        const back = colOf.get(e.from) > col;
        return { ...e, kind: back && (!e.kind || e.kind === 'main') ? 'loop' : e.kind || 'main' };
      });
      const plainNext = ins.length === 1 && ins[0].from === prev && ins[0].kind === 'main' && !ins[0].label;
      const inLines = plainNext ? '' : ins.map((e) => `<p class="ftl-in ${esc(e.kind)}">${e.kind === 'crash' ? IN_ICON.bolt : IN_ICON.arrow}<span>${esc(TT(e.kind === 'loop' ? 'againAfter' : 'after'))} <b>${esc(nameOf.get(e.from))}</b>${e.label ? ': ' + esc(e.label) : ''}</span></p>`).join('');
      const btns = ids.map((id) => `<button type="button" class="ftl-b" data-story="${esc(id)}" data-hover aria-label="Story ${num(id)}: ${esc(titleOf(id))}" ${tipAttr(storyTip(id))}><span class="badge">${num(id)}</span></button>`).join('');
      h += `<li class="ftl-step ${kind}${seg ? ' r-' + seg.tone : ''}" data-stories="${esc(ids.join(' '))}"><div class="ftl-card">
        <div class="ftl-top"><span class="ftl-lane${lane.tone === 'alert' ? ' l-alert' : lane.tone === 'strong' ? ' l-strong' : ''}">${esc(lane.label)}</span>${btns ? `<span class="ftl-ids">${btns}</span>` : ''}</div>
        ${inLines}<p class="ftl-name">${esc(n.label)}</p>${n.sub ? `<p class="ftl-sub">${esc(n.sub)}</p>` : ''}</div></li>`;
      prev = n.id;
    });
    marks(Infinity);
    const list = `<ol class="ftl-list" aria-label="${esc(TT('lifecycleListAria', { subject: LC.subject || TT('theWork') }))}">${h}</ol>`;
    const w = LC.wrap && byId.has(LC.wrap.story) ? LC.wrap : null;
    if (!w) return `<div class="ftl">${list}</div>`;
    return `<div class="ftl"><div class="ftl-frame" data-wrap="${esc(w.story)}">
      <button type="button" class="ftl-wl" data-story="${esc(w.story)}" data-hover aria-label="Story ${num(w.story)}: ${esc(titleOf(w.story))}"><span class="badge">${num(w.story)}</span>${esc(plain(w.label || shortOf(w.story)))}</button>
      ${w.tip ? `<p class="ftl-wt">${esc(w.tip)}</p>` : ''}${list}</div></div>`;
  }
  if (LC) {
    renderFlow();
    $('#flow').addEventListener('scroll', flowEdges, { passive: true });
    if (window.ResizeObserver) new ResizeObserver(() => layoutFlow()).observe($('#flow'));
    else window.addEventListener('resize', () => layoutFlow());
  } else {
    // no lifecycle: the panel keeps only the story chips
    $('#h-flow').textContent = TT('stories');
    $('#flow').remove();
  }

  /* ---------- slice chart ---------- */
  const WORD = TT('count');
  /** The heading of a build step: its number, and how many stories build at once in it. */
  const stageName = (g) => (g.n > 1 ? TT('stageTogether', { n: g.stage, count: WORD[g.n] || g.n }) : TT('stage', { n: g.stage }));
  /* one column per story in build order, its slice read top (where it starts) to bottom (the tables);
     a seam is a later story using or changing, in the same layer, what an earlier build step made or changed */
  function renderMatrix() {
    const ROLE = {
      new: [CELL.new || '', CELL.newTip || ''],
      changes: [CELL.changes || '', CELL.changesTip || ''],
      uses: [CELL.uses || '', CELL.usesTip || ''],
    };
    const cellOf = (sid, lid) => {
      const c = (((D.slices || {})[sid] || {}).cells || {})[lid];
      return c && ROLE[c.role] ? c : null;
    };
    const rows = layerList.slice().reverse(); // drawn top-down, the layers go bottom-up
    const groupLabel = (id) => ((D.groups || []).find((g) => g.id === id) || {}).label || '';
    const N = order.length;
    const col = (i) => i + 2;
    // the grid rows: build steps, story heads, then per group a heading and its layers, then the tests
    const ents = [];
    rows.forEach((l, li) => {
      if (li === 0 || rows[li - 1].group !== l.group) ents.push({ g: l.group });
      ents.push({ l });
    });
    const R0 = 3, RF = R0 + ents.length, R = RF;
    const seams = [];
    const fromOf = {};
    rows.forEach((l) => order.forEach((s, ti) => {
      if (!cellOf(s.id, l.id)) return;
      for (let i = ti - 1; i >= 0; i--) {
        const e = order[i], c = cellOf(e.id, l.id);
        if (stageOf[e.id] < stageOf[s.id] && c && c.role !== 'uses') {
          const tested = tests.some((t) => t.later === s.id && t.earlier === e.id);
          seams.push({ l: l.id, from: e.id, to: s.id, fi: i, ti, tested });
          fromOf[s.id + '|' + l.id] = e.id;
          return;
        }
      }
    }));
    const stages = [];
    order.forEach((s, i) => { const last = stages[stages.length - 1]; if (last && last.stage === stageOf[s.id]) last.n++; else stages.push({ stage: stageOf[s.id], at: i, n: 1 }); });

    // legend and the second line of the explanation, in words; a phone shows a seam as a tag, not a line (sl-dk / sl-ph)
    const chip = (r) => `<i class="sl-role k-${r}">${esc(ROLE[r][0])}</i>`;
    const seamTag = (from, tested) => `<span class="sl-mtag${tested ? '' : ' open'}">${esc(TT('buildsOn'))}<span class="badge xs">${num(from)}</span></span>`;
    const seamOpen = esc(TT(afterBuild ? 'seamOpenBuilt' : 'seamOpen'));
    const both = (dk, ph) => (ph ? `<span class="sl-dk">${esc(dk)}</span><span class="sl-ph">${esc(ph)}</span>` : esc(dk));
    $('#lg-slices').innerHTML = ['new', 'changes', 'uses'].map((r) => `<span class="sl-lg">${chip(r)}${esc(ROLE[r][1])}</span>`).join('')
      + (seams.length ? `<span class="sl-lg sl-dk"><i class="sl-lgseam"></i>${esc(CELL.seam || '')}: ${esc(TT('seamTested'))}</span>`
        + `<span class="sl-lg sl-ph">${seamTag(seams[0].from, true)}${esc(CELL.seam || '')}: ${esc(TT('seamTested'))}</span>` : '')
      + (seams.some((m) => !m.tested) ? `<span class="sl-lg sl-dk"><i class="sl-lgseam open"></i>${seamOpen}</span>`
        + `<span class="sl-lg sl-ph">${seamTag(seams.find((m) => !m.tested).from, false)}${seamOpen}</span>` : '');
    if (X.slices && X.slicesPhone && $('#x-slices')) $('#x-slices').innerHTML = both(X.slices, X.slicesPhone);
    if (X.slicesLink && seams.length && !$('#x-slices2')) $('#x-slices').insertAdjacentHTML('afterend', `<p class="explain how" id="x-slices2">${both(X.slicesLink, X.slicesLinkPhone)}</p>`);

    const at = (r, c, extra = '') => `style="grid-row:${r};grid-column:${c}${extra}"`;
    let h = `<div class="sl-corner" ${at('1 / 3', 1)}><span>${esc(TT('from'))}</span><i class="sl-down" aria-hidden="true"></i><span>${esc(TT('downTo'))}</span></div>`;
    stages.forEach((g) => {
      h += `<div class="sl-stbg" ${at(`1 / ${R + 1}`, `${col(g.at)} / ${col(g.at + g.n)}`)}></div>`;
      h += `<div class="sl-stage" ${at(1, `${col(g.at)} / ${col(g.at + g.n)}`)}>${esc(stageName(g))}</div>`;
    });
    order.forEach((s, i) => {
      const sl = (D.slices || {})[s.id] || {};
      const top = rows.find((l) => cellOf(s.id, l.id));
      h += `<button class="sl-head" data-col="${esc(s.id)}" data-story="${esc(s.id)}" data-hover ${at(2, col(i))}>`
        + `<span class="sl-hn"><span class="badge sm">${num(s.id)}</span><span>${esc(titleOf(s.id))}</span></span>`
        + (s.plain ? `<span class="sl-hp plain">${esc(s.plain)}</span>` : '')
        + (sl.delivers ? `<span class="sl-hd">${esc(sl.delivers)}</span>` : '')
        + (top ? `<span class="sl-hs">${esc(TT('startsAt'))} <b>${esc(top.label)}</b></span>` : '')
        + '</button>';
    });
    ents.forEach((en, k) => {
      const r = R0 + k;
      if (en.g) h += `<div class="sl-group" ${at(r, `1 / ${N + 2}`)}><span>${esc(groupLabel(en.g))}</span></div>`;
      else h += `<div class="sl-y" ${at(r, 1)} ${tipAttr(`<b>${esc(en.l.label)}</b>` + (en.l.tip ? `<br>${esc(en.l.tip)}` : ''))}><span class="sl-yl">${esc(en.l.label)}</span>${en.l.tip ? `<span class="sl-yt">${codeLines(en.l.tip)}</span>` : ''}</div>`;
    });
    order.forEach((s, i) => {
      const hit = ents.map((en, k) => (en.l && cellOf(s.id, en.l.id) ? k : -1)).filter((k) => k >= 0);
      if (!hit.length) return;
      const first = hit[0], last = hit[hit.length - 1];
      for (let k = first; k <= last; k++) {
        const en = ents[k], c = en.l && cellOf(s.id, en.l.id);
        const cls = `sl-cell${k === first ? ' top' : ''}${k === last ? ' bot' : ''}`;
        if (!c) { h += `<div class="${cls}" data-col="${esc(s.id)}" ${at(R0 + k, col(i))}></div>`; continue; }
        const from = fromOf[s.id + '|' + en.l.id];
        const tipHtml = `${storyTip(s.id)}<br><b>${esc(ROLE[c.role][0])}</b>: ${esc(en.l.label)}${en.l.tip ? ` <span class="muted">(${esc(en.l.tip)})</span>` : ''}`
          + (c.note ? `<br>${esc(c.note)}` : '') + (from ? `<br>${esc(TT('buildsOn'))} ${num(from)}: ${esc(titleOf(from))}` : '');
        h += `<div class="${cls}" data-col="${esc(s.id)}" ${at(R0 + k, col(i))}>`
          + `<div class="sl-card c-${c.role}${from ? ' seam' : ''}${seams.some((m) => m.from === s.id && m.l === en.l.id) ? ' feeds' : ''}" data-story="${esc(s.id)}" data-hover ${tipAttr(tipHtml)}>`
          + `<span class="sl-cn">${chip(c.role)}${nameSpan(en.l.label)}</span>`
          + (c.note ? `<span class="sl-note">${esc(c.note)}</span>` : '')
          + (from ? `<span class="sl-from">${esc(TT('buildsOn'))}<span class="badge xs">${num(from)}</span></span>` : '')
          + '</div></div>';
      }
    });
    seams.forEach((m) => {
      const k = ents.findIndex((en) => en.l && en.l.id === m.l);
      // the badge on the arrow names the story it comes from, also when the line runs behind a card in between
      const via = order.slice(m.fi + 1, m.ti).some((x) => cellOf(x.id, m.l));
      h += `<div class="sl-seam${m.tested ? '' : ' open'}${via ? ' via' : ''}" ${at(R0 + k, `${col(m.fi)} / ${col(m.ti)}`)} aria-hidden="true"><span class="badge xs">${num(m.from)}</span></div>`;
    });
    const footOf = (s) => {
      const mine = tests.filter((t) => t.later === s.id);
      const later = [...new Set(seams.filter((m) => m.from === s.id).map((m) => m.to))];
      // one line per test, a link to its card under the integration tests, where the test is told in full
      let f = mine.map((t) => `<a class="sl-test" href="#tc-${esc(t.id)}" data-pin="${esc(t.id)}" ${tipAttr(`<b>${esc(t.id)}</b> ${esc(t.full || '')}`)}><span class="sl-tt"><span class="sl-tid">${esc(t.id)}</span> <span class="sl-tl">${esc(TT('testWith'))} <span class="sl-nw">story <span class="badge xs">${num(t.earlier)}</span></span></span></span></a>`).join('');
      if (later.length) f += `<div class="sl-test base"><span class="sl-tt">${esc(TT(later.length > 1 ? 'feedsMany' : 'feedsOne'))} ${later.map((x) => `<span class="badge xs">${num(x)}</span>`).join(' ')}</span></div>`;
      return f || `<div class="sl-test none"><span class="sl-td">${esc(TT('noSeam'))}</span></div>`;
    };
    order.forEach((s, i) => { h += `<div class="sl-foot" data-col="${esc(s.id)}" ${at(RF, col(i))}>${footOf(s)}</div>`; });
    const toTests = esc(TT(afterBuild ? 'toTestsBuilt' : 'toTests'));
    if (tests.length) h += `<a class="sl-tolink" href="#sec-tests" ${at(RF + 1, `2 / ${N + 2}`)}>${toTests}</a>`;
    const el = $('#matrix');
    $('#sec-slices').classList.toggle('sl-wide', N >= 5);
    el.style.setProperty('--n', N);
    el.style.gridTemplateRows = `repeat(${RF + 1}, auto)`;
    el.innerHTML = h;

    /* a phone or a tablet: no columns but one block per story, in build order under its build step, its parts a list
       read from where it starts down to the tables. A part it only uses, with no seam and no note, folds into one line per group. */
    const chev = '<svg class="sl-mchev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg>';
    const story = (s) => {
      const sl = (D.slices || {})[s.id] || {};
      const top = rows.find((l) => cellOf(s.id, l.id));
      let parts = '', grp = null, used = [];
      const fold = () => { if (used.length) parts += `<p class="sl-mused">${chip('uses')}${nameSpan(used.join(', '))}</p>`; used = []; };
      rows.forEach((l) => {
        const c = cellOf(s.id, l.id);
        if (!c) return;
        if (l.group !== grp) { fold(); grp = l.group; if (groupLabel(grp)) parts += `<p class="sl-mgroup">${esc(groupLabel(grp))}</p>`; }
        const m = seams.find((x) => x.to === s.id && x.l === l.id);
        const feeds = [...new Set(seams.filter((x) => x.from === s.id && x.l === l.id).map((x) => x.to))];
        if (c.role === 'uses' && !m && !c.note) { used.push(l.label); return; }
        parts += `<div class="sl-mcard c-${c.role}${m ? ' seam' : ''}${m && !m.tested ? ' open' : ''}" data-story="${esc(s.id)}">`
          + `<span class="sl-cn">${chip(c.role)}${nameSpan(l.label)}</span>`
          + (c.note ? `<span class="sl-note">${esc(c.note)}</span>` : '')
          + (m ? seamTag(m.from, m.tested) + (m.tested ? '' : `<span class="sl-mfeed">${esc(TT(afterBuild ? 'noTest' : 'noTestYet'))}</span>`) : '')
          + (feeds.length ? `<span class="sl-mfeed">${esc(TT(feeds.length > 1 ? 'feedsMany' : 'feedsOne'))} ${feeds.map((x) => `<span class="badge xs">${num(x)}</span>`).join('')}</span>` : '')
          + '</div>';
      });
      fold();
      return `<article class="sl-mstory"><button class="sl-mhead" data-story="${esc(s.id)}">`
        + `<span class="sl-hn"><span class="badge sm">${num(s.id)}</span><span>${esc(titleOf(s.id))}</span>${chev}</span>`
        + (s.plain ? `<span class="sl-hp plain">${esc(s.plain)}</span>` : '')
        + (sl.delivers ? `<span class="sl-hd">${esc(sl.delivers)}</span>` : '')
        + (top ? `<span class="sl-hs">${esc(TT('startsAt'))} <b>${esc(top.label)}</b></span>` : '')
        + `</button><div class="sl-mparts">${parts}</div><div class="sl-foot">${footOf(s)}</div></article>`;
    };
    $('#sl-list').innerHTML = stages.map((g) => `<div class="sl-mstage" role="group" aria-label="${esc(TT('stage', { n: g.stage }))}">`
      + `<h3 class="sl-stage">${esc(stageName(g))}</h3>`
      + order.slice(g.at, g.at + g.n).map(story).join('') + '</div>').join('')
      + (tests.length ? `<a class="sl-tolink" href="#sec-tests">${toTests}</a>` : '');
    fitNames(el);
    fitNames($('#sl-list'));
    if (window.ResizeObserver) { const ro = new ResizeObserver((es) => es.forEach((x) => fitNames(x.target))); ro.observe(el); ro.observe($('#sl-list')); }
  }
  if (layerList.length && order.length) renderMatrix(); else $('#sec-slices').remove();
  // columns that run on past the right edge (a story open on a wide screen) fade out there
  const slScroll = $('.sl-scroll');
  if (slScroll) {
    const slEdges = () => { const max = slScroll.scrollWidth - slScroll.clientWidth; slScroll.classList.toggle('more-r', max > 1 && slScroll.scrollLeft < max - 2); };
    slScroll.addEventListener('scroll', slEdges, { passive: true });
    if (window.ResizeObserver) new ResizeObserver(slEdges).observe(slScroll); else window.addEventListener('resize', slEdges);
    slEdges();
  }
  /* ---------- the views under the masthead (design-tabs.js): Functional (all the rest), Code Scaffold (only the
     drawing; after the build it is called Code) and after the build Review (the changes file by file). The drawing measures its text, so it mounts the
     first time it shows; Review mounts the first time it shows as well. ---------- */
  let td = null, tabs = null, rv = null, back = null, v5 = null, sw = null;
  const tdSec = $('#sec-design');
  const main = tdSec.parentNode;
  // a page without a drawing (an intent built before the Code Scaffold, design.drawing false): Functional and Review only
  const drawn = !!(D.design && D.design.drawing !== false);
  if (!afterBuild) $('#sec-review').remove();
  let rvSec = $('#sec-review');
  const titles = () => Object.fromEntries(order.map((s) => [s.id, s.title]));
  const setHash = (h) => { try { history.replaceState(null, '', h); } catch (err) { /* the view shows all the same */ } };
  const showView = (v) => !!tabs && tabs.show(v);
  /** What a view needs when it shows, a tab clicked or a link followed (TdTabs calls it on every show). */
  function shown(v) {
    if (sw) sw.shown(v);
    if (v === 'flow' && !td) {
      td = window.CodeScaffold.mount($('#td-mount'), D.design, { titles: titles(), steer: D.phase === 'inception', phase: D.phase,
        stories: Object.fromEntries(order.map((s) => [s.id, { story: s.story, built: s.built, plain: s.plain }])), chipSlot: $('.mast-chips'),
        onReview: rvSec ? openReview : null });
    }
    if (v === 'review') {
      if (back) back.clear();
      if (!rv) rv = window.TdTabs.reviewer($('#review-mount'), { model: D.design, titles: titles(), phase: D.phase, onFlow: drawn ? toFlow : null });
      rv.show();
    }
    // the story open on the page is the story the drawing shows; its side panel would cover the view
    if (v !== 'functional' && selected) { if (v === 'flow') td.choose(selected); close(); }
  }
  /** From the flow view to a part's change in Review. */
  function openReview(id) {
    setHash('#review' + (id ? '/' + id : ''));
    if (showView('review') && id) rv.open(id);
  }
  /** The file of a part as Review lists it: the last piece of its path, else its name. */
  const fileOf = (id) => { const p = D.design.parts.find((x) => x.id === id); return p ? (p.path ? p.path.split('/').pop() : p.name) : null; };
  /** From Review back to the flow view, that part chosen in the drawing; the masthead then holds the way back. */
  function toFlow(id) {
    setHash(id ? '#' + id : '#flow');
    if (back && id) back.set(id, fileOf(id));
    const mounted = !!td; // a fresh drawing follows the link itself
    showView('flow');
    if (mounted && id) td.follow('#' + id);
  }
  // the switches Details and ? on the masthead (design-switches.js): the plain words and the explanations of
  // the page, and the help of the tab shown; the tabs of the v5 page follow them
  if (window.TdSwitches) {
    sw = window.TdSwitches.mount({ slot: $('#mast-sw'), built: afterBuild, plan: !!D.plan, code: drawn && D.design.parts.length > 0,
      tabs: () => (tabs ? [...tabs.el.querySelectorAll('[role="tab"]')].map((b) => b.dataset.view) : ['functional']),
      now: () => (tabs && tabs.get()) || 'functional',
      onChange: (s) => { if (v5) v5.set(s); } });
  } else $('#mast-sw').remove();
  // the drawing and Review need the drawing's model and its code; a page without them still has the tab of the v5
  // page it holds (#v5-embed): the C4 model, in a frame made the first time it shows, opened as the switches stand
  const withDrawing = !!(D.design && window.TdTabs && (window.CodeScaffold || !drawn));
  v5 = window.TdTabs && window.TdTabs.embed ? window.TdTabs.embed({ page: main, ...(sw ? sw.state() : {}) }) : null;
  if (!withDrawing) { tdSec.remove(); if (rvSec) rvSec.remove(); rvSec = null; }
  if (withDrawing || v5) {
    tabs = window.TdTabs.create({ page: main, flow: withDrawing && drawn ? tdSec : null, review: rvSec, built: afterBuild, embed: v5, onShow: shown });
    if (!drawn) tdSec.remove();
    back = window.TdTabs.back({ onBack: openReview });
    // beside the switch, in the flow view, the drawing's story chips (CodeScaffold, chipSlot)
    const mv = document.createElement('div');
    mv.className = 'mast-views';
    const slot = document.createElement('div');
    slot.className = 'mast-chips';
    mv.append(tabs.el, back.el, slot);
    $('.mast .wrap').append(mv);
    // after the build the masthead carries the heading: the drawing's panel starts with the drawing
    if (drawn && D.phase === 'construction' && D.design.build) {
      tdSec.setAttribute('aria-label', TT('design'));
      tdSec.removeAttribute('aria-labelledby');
      $('.sec-head', tdSec).remove();
    }
  }
  /** A link into the drawing: story-N, or a part or module of it. */
  const inDrawing = (h) => withDrawing && (/^story-\d+$/.test(h) || D.design.parts.some((p) => p.id === h) || D.design.modules.some((m) => m.id === h));
  /** A link to something on the functional side of the page. */
  const inFunc = (h) => { const el = h && document.getElementById(h); return !!el && !tdSec.contains(el) && !(rvSec && rvSec.contains(el))
    && !(v5 && Object.values(v5.sections).some((s) => s.contains(el))); };
  const fromHash = () => {
    if (!tabs) return;
    // after the build the page opens on what was built, and the saved Code Scaffold page (D.scaffold) on the drawing
    const r = window.TdTabs.route(location.hash, { review: !!rvSec, built: !!(asBuilt || D.scaffold), flow: drawn, c4: !!(v5 && v5.has.c4),
      drawing: inDrawing, func: inFunc });
    if (r.view === 'review') { showView('review'); if (r.part) rv.open(r.part); return; }
    if (r.follow) {
      const mounted = !!td; // a fresh drawing follows the link itself
      showView('flow');
      if (mounted) td.follow(location.hash);
      return;
    }
    // a view this page has not (the drawing's, on a page without one): Functional
    if (!showView(r.view)) showView('functional');
  };

  /* ---------- integration tests: one column per build step, one arrow per test ---------- */
  let pinTest = null, redrawTests = null;
  function renderTests() {
    const box = $('#tests');
    const NH = 38, CG = 92, PAD = 6;
    let NW = 208;
    const nStage = Math.max(...order.map((s) => stageOf[s.id]));
    const cols = Array.from({ length: nStage }, () => []);
    const node = new Map();
    const add = (key, k, real) => { const n = { key, k, real, ins: [], outs: [] }; node.set(key, n); cols[k].push(n); return n; };
    order.forEach((s) => add(s.id, stageOf[s.id] - 1, true));
    // an arrow that skips a build step passes through a gap in that column
    // tests between the same two stories share one arrow, labelled with all their numbers
    const pairs = [];
    tests.forEach((t) => {
      let p = pairs.find((x) => x.later === t.later && x.earlier === t.earlier);
      if (!p) pairs.push(p = { later: t.later, earlier: t.earlier, ids: [], lines: [] });
      p.ids.push(t.id); p.lines.push(`${t.id}: ${t.full}`);
    });
    pairs.forEach((p) => { p.id = p.ids.join(' '); p.full = p.lines.join('\n'); });
    const chains = pairs.map((t) => {
      const a = stageOf[t.earlier] - 1, b = stageOf[t.later] - 1;
      if (b <= a) return { t, keys: [t.earlier, t.later], side: true };
      const keys = [t.earlier];
      for (let k = a + 1; k < b; k++) keys.push(add(`${t.later}>${t.earlier}@${k}`, k, false).key);
      keys.push(t.later);
      for (let i = 1; i < keys.length; i++) { node.get(keys[i - 1]).outs.push(keys[i]); node.get(keys[i]).ins.push(keys[i - 1]); }
      return { t, keys };
    });

    // order each column so the arrows cross as little as possible
    const pos = () => { const p = new Map(); cols.forEach((col) => col.forEach((n, i) => p.set(n.key, i))); return p; };
    const crossings = () => {
      const p = pos(); let c = 0;
      for (let k = 0; k < nStage - 1; k++) {
        const es = [];
        cols[k].forEach((n) => n.outs.forEach((o) => es.push([p.get(n.key), p.get(o)])));
        for (let i = 0; i < es.length; i++) for (let j = i + 1; j < es.length; j++) if ((es[i][0] - es[j][0]) * (es[i][1] - es[j][1]) < 0) c++;
      }
      return c;
    };
    const sweep = (k, side) => {
      const p = pos();
      const v = new Map(cols[k].map((n) => {
        const nb = side === 'in' ? n.ins : n.outs;
        return [n.key, nb.length ? nb.reduce((sum, x) => sum + p.get(x), 0) / nb.length : p.get(n.key)];
      }));
      cols[k].sort((a, b) => v.get(a.key) - v.get(b.key));
    };
    let best = cols.map((col) => col.slice()), bestC = crossings();
    for (let it = 0; it < 8; it++) {
      for (let k = 1; k < nStage; k++) sweep(k, 'in');
      for (let k = nStage - 2; k >= 0; k--) sweep(k, 'out');
      const c = crossings();
      if (c < bestC) { bestC = c; best = cols.map((col) => col.slice()); }
    }
    best.forEach((col, k) => { cols[k] = col; });

    // place each column, pulling a story towards the stories it is linked to
    const size = (n) => (n.real ? NH : 0);
    const sep = (a, b) => (size(a) + size(b)) / 2 + (a.real && b.real ? 22 : 16);
    const y = new Map();
    const spans = cols.map((col) => { let acc = 0; col.forEach((n, i) => { if (i) acc += sep(col[i - 1], n); y.set(n.key, acc); }); return acc; });
    const H0 = Math.max(...spans);
    cols.forEach((col, k) => col.forEach((n) => y.set(n.key, y.get(n.key) + (H0 - spans[k]) / 2)));
    const fit = (col, want) => {
      const f = [], b = [], r = [];
      col.forEach((n, i) => { f[i] = i ? Math.max(want[i], f[i - 1] + sep(col[i - 1], n)) : want[i]; });
      for (let i = col.length - 1; i >= 0; i--) b[i] = i < col.length - 1 ? Math.min(want[i], b[i + 1] - sep(col[i], col[i + 1])) : want[i];
      col.forEach((n, i) => { const m = (f[i] + b[i]) / 2; r[i] = i ? Math.max(m, r[i - 1] + sep(col[i - 1], n)) : m; });
      return r;
    };
    for (let it = 0; it < 6; it++) {
      cols.forEach((col) => {
        const want = col.map((n) => { const nb = [...n.ins, ...n.outs]; return nb.length ? nb.reduce((sum, x) => sum + y.get(x), 0) / nb.length : y.get(n.key); });
        fit(col, want).forEach((v, i) => y.set(col[i].key, v));
      });
    }
    const top = Math.min(...[...node.values()].map((n) => y.get(n.key) - size(n) / 2));
    node.forEach((n) => y.set(n.key, y.get(n.key) - top + PAD));
    const plotH = Math.max(...[...node.values()].map((n) => y.get(n.key) + size(n) / 2)) + PAD;
    /* the graph is drawn again once the web font is in: a story box is as wide as its name needs, measured in the page font */
    const draw = () => {
      NW = Math.min(300, Math.max(208, Math.ceil(Math.max(...order.map((s) => textW(plain(shortOf(s.id)), '600 14px'))) + 58)));
      const X = (k) => k * (NW + CG);
      const W = X(nStage - 1) + NW + 8 + (chains.some((c) => c.side) ? 52 : 0);

      // spread the ends of several arrows over the side of a story
      const port = new Map();
      const spread = (list, keyOf) => list.forEach((e, i) => {
        const step = list.length > 1 ? Math.min(9, 28 / (list.length - 1)) : 0;
        port.set(keyOf(e), (i - (list.length - 1) / 2) * step);
      });
      order.forEach((s) => {
        const out = chains.filter((c) => !c.side && c.keys[0] === s.id).sort((a, b) => y.get(a.keys[1]) - y.get(b.keys[1]));
        const inn = chains.filter((c) => !c.side && c.keys[c.keys.length - 1] === s.id).sort((a, b) => y.get(a.keys[a.keys.length - 2]) - y.get(b.keys[b.keys.length - 2]));
        spread(out, (c) => c.t.id + ':out');
        spread(inn, (c) => c.t.id + ':in');
      });

      let edges = '';
      chains.forEach((c) => {
        const id = c.t.id;
        let d, ah, lx, ly;
        if (c.side) {
          const k = stageOf[c.t.earlier] - 1, x = X(k) + NW, ya = y.get(c.t.earlier), yb = y.get(c.t.later);
          d = `M${x} ${ya}C${x + 44} ${ya} ${x + 44} ${yb} ${x + 8} ${yb}`;
          ah = `M${x + 8} ${yb - 4.5}L${x + 1} ${yb}L${x + 8} ${yb + 4.5}Z`;
          lx = x + 33; ly = (ya + yb) / 2;
        } else {
          const pts = [];
          c.keys.forEach((key, i) => {
            const n = node.get(key), x0 = X(n.k), yy = y.get(key);
            if (i === 0) pts.push([x0 + NW, yy + (port.get(id + ':out') || 0)]);
            else if (i === c.keys.length - 1) pts.push([x0, yy + (port.get(id + ':in') || 0)]);
            else pts.push([x0, yy], [x0 + NW, yy]);
          });
          const end = pts[pts.length - 1];
          end[0] -= 8;
          d = `M${pts[0][0]} ${pts[0][1]}`;
          for (let i = 1; i < pts.length; i++) {
            const [xa, ya] = pts[i - 1], [xb, yb] = pts[i];
            if (i % 2 === 0) { d += `L${xb} ${yb}`; continue; } // straight through a gap
            const dx = (xb - xa) / 2;
            d += `C${xa + dx} ${ya} ${xb - dx} ${yb} ${xb} ${yb}`;
          }
          ah = `M${end[0]} ${end[1] - 4.5}L${end[0] + 7} ${end[1]}L${end[0]} ${end[1] + 4.5}Z`;
          lx = (pts[0][0] + pts[1][0]) / 2; ly = (pts[0][1] + pts[1][1]) / 2;
        }
        const tipHtml = `<span class="muted">${esc(TT('pair', { later: num(c.t.later), earlier: num(c.t.earlier) }))}</span><br>${c.t.lines.map(esc).join('<br>')}`;
        const lw = 12 + 7.2 * String(id).length;
        edges += `<g class="tedge" data-t="${esc(id)}" data-later="${esc(c.t.later)}" data-earlier="${esc(c.t.earlier)}" data-tip-at="graph" ${tipAttr(tipHtml)}>
          <path class="hit" d="${d}"/><path class="ln" d="${d}"/><path class="ah" d="${ah}"/>
          <rect class="tlb" x="${lx - lw / 2}" y="${ly - 10}" width="${lw}" height="20" rx="10"/><text class="tlt" x="${lx}" y="${ly + 4}">${esc(id)}</text></g>`;
      });

      let nodes = '';
      order.forEach((s) => {
        const x = X(stageOf[s.id] - 1), cy = y.get(s.id), y0 = cy - NH / 2;
        nodes += `<g class="tnode" data-story="${esc(s.id)}" data-hover role="button" tabindex="0" aria-label="Story ${num(s.id)}: ${esc(titleOf(s.id))}" ${tipAttr(storyTip(s.id))}>
          <rect x="${x}" y="${y0}" width="${NW}" height="${NH}" rx="10"/>
          <circle class="tbc" cx="${x + 22}" cy="${cy}" r="11.5"/><text class="tbt" x="${x + 22}" y="${cy + 4}">${num(s.id)}</text>
          <text class="tl" x="${x + 42}" y="${cy + 5}" data-fit="${NW - 52}">${esc(plain(shortOf(s.id)))}</text></g>`;
      });

      const ax = plotH + 18;
      let axis = `<g class="taxis"><line x1="0" y1="${ax}" x2="${W}" y2="${ax}"/>`;
      for (let k = 0; k < nStage; k++) {
        const cx = X(k) + NW / 2;
        axis += `<line x1="${cx}" y1="${ax}" x2="${cx}" y2="${ax + 6}"/><text x="${cx}" y="${ax + 26}">${esc(TT('stage', { n: k + 1 }))}</text>`;
      }
      axis += '</g>';
      const Hs = ax + 36;
      box.innerHTML = `<svg viewBox="0 0 ${W} ${Hs}" width="${W}" height="${Hs}" role="img" aria-label="${esc(TT('testsAria'))}">${edges}${nodes}${axis}</svg>`;
      return W;
    };
    let W = draw();

    $('#tkey').textContent = TT('testsKey');

    // one card per test: who tests with whom, what it does, the real code it runs against, what it expects
    const lay = $('#tlay');
    // a small graph next to a few cards; a wide graph or many tests: graph on top, cards in two columns
    const sideWanted = () => W <= 600 && tests.length <= 4;
    lay.classList.toggle('side', sideWanted());
    const coarse = matchMedia('(pointer: coarse)').matches;
    const and =(xs) => (xs.length < 2 ? xs.join('') : `${xs.slice(0, -1).join(', ')} ${esc(window.TdText.t('design.and'))} ${xs[xs.length - 1]}`);
    const sname = (id) => `<button type="button" class="tc-s" data-story="${esc(id)}" title="${esc(TT('openStory', { id: num(id), title: titleOf(id) }))}"><span class="tc-n">${num(id)}</span>${esc(plain(shortOf(id)))}</button>`;
    const hl = (s) => esc(s).replace(/\b(?:[A-Z][A-Z0-9]*_[A-Z0-9_]+|[A-Z]{4,}|[A-Z][a-z0-9]+(?:[A-Z][a-z0-9]+)+)\b/g, (m) => `<code class="tc-k">${m}</code>`);
    const codeRow = (t) => {
      const code = (t.code || []).filter((c) => c && c.name);
      if (!code.length) return `<dt>${esc(TT('runsAgainst'))}</dt><dd class="tc-none">${esc(TT('noClasses'))}</dd>`;
      const groups = [];
      code.forEach((c) => { let g = groups.find((x) => x.story === c.story); if (!g) groups.push(g = { story: c.story, items: [] }); g.items.push(c); });
      const who = (s) => esc(s === t.later ? TT('fromThisStory') : s ? TT('fromStory', { id: num(s) }) : TT('existing'));
      // the tag about the source stays on the line of the last word before it
      const src = t.codeFrom === 'drawing' ? ` <span class="tc-src">${esc(TT('fromDrawing'))}</span>` : '';
      const tail = (w, i) => { if (i < groups.length - 1 || !src) return w; const at = w.lastIndexOf(' '); return `${w.slice(0, at + 1)}<span class="tc-nw">${w.slice(at + 1)}${src}</span>`; };
      const parts = groups.map((g, i) => `${esc(TT('theReal'))} ${and(g.items.map((c) => `<code class="tc-c"${c.what && !coarse ? ' tabindex="0" ' + tipAttr(esc(c.what)) : ''}>${esc(c.name)}</code>`))} ${tail(who(g.story), i)}`);
      // on touch there is no hover: what each class does stands under the sentence
      const what = coarse ? code.filter((c) => c.what) : [];
      const whatList = what.length ? `<ul class="tc-what">${what.map((c) => `<li><code class="tc-c">${esc(c.name)}</code>${esc(c.what)}</li>`).join('')}</ul>` : '';
      return `<dt>${esc(TT('runsAgainst'))}</dt><dd>${parts.join(esc(TT('andThen')))}${whatList}</dd>`;
    };
    // the expected outcome, cut from the test text, shows as a quote of the test plan
    const expectRow = (t) => (t.expect
      ? `<dt>${esc(TT('expected'))}</dt><dd><span class="tc-lead">${esc(TT('perPlan'))}</span> <q class="tc-q">${hl(t.expect)}</q></dd>`
      : `<dt>${esc(TT('expected'))}</dt><dd class="tc-none">${esc(TT('noExpect'))}</dd>`);
    const whenRow = (t) => {
      const [l, e] = [num(t.later), num(t.earlier)];
      const key = (stageOf[t.earlier] < stageOf[t.later] ? 'whenAfter' : 'whenWith') + (afterBuild ? 'Built' : '');
      return `<dt>${esc(TT('when'))}</dt><dd><span class="tc-step">${esc(TT('stage', { n: stageOf[t.later] }))}</span> ${esc(TT(key, { later: l, earlier: e }))}</dd>`;
    };
    const sorted = [...tests].sort((a, b) => stageOf[a.later] - stageOf[b.later] || (parseInt(a.id.slice(1), 10) - parseInt(b.id.slice(1), 10)));
    $('#tcards').innerHTML = sorted.map((t) => `<li class="tcard" id="tc-${esc(t.id)}" data-t="${esc(t.id)}" tabindex="0" aria-label="${esc(TT('pairAria', { id: t.id, later: num(t.later), earlier: num(t.earlier) }))}">
      <div class="tc-head"><span class="tc-id">${esc(t.id)}</span>
        <div class="tc-pair">${sname(t.later)}<span class="tc-rel">${esc(TT('testsTogether'))}</span>${sname(t.earlier)}</div></div>
      <p class="tc-do">${esc(t.full)}</p>
      <dl class="tc-rows">${codeRow(t)}${expectRow(t)}${whenRow(t)}</dl></li>`).join('');

    // the graph stays next to the cards only while both have room; on a phone or tablet the graph shrinks to
    // the width while it stays readable, otherwise it steps aside and the cards say it all
    const GBOX = 34; // the padding and border around the graph
    const narrow = matchMedia('(max-width: 1024px), (pointer: coarse)');
    let laidW = 0;
    const fitTests = () => {
      const room = lay.clientWidth;
      if (!room || room === laidW) return; // hidden behind the other view, or nothing changed
      laidW = room;
      let side = sideWanted() && room >= W + GBOX + 36 + 400;
      const k = (room - GBOX) / W;
      lay.classList.toggle('side', side);
      // next to the cards only while the graph fills a fair part of their column, or the cards are taller than the
      // screen (then the graph stays in sight beside them); else the graph on top and the cards side by side under it
      if (side) {
        const gh = $('.tgraph', lay).offsetHeight, ch = $('#tcards').offsetHeight;
        if (ch > gh * 1.6 && ch < window.innerHeight - 40) { side = false; lay.classList.remove('side'); }
      }
      lay.classList.toggle('tg-fit', !side && narrow.matches && k < 1 && k >= 0.75);
      lay.classList.toggle('tg-off', !side && narrow.matches && k < 0.75);
    };
    fitTests();
    if (window.ResizeObserver) new ResizeObserver(fitTests).observe(lay); else window.addEventListener('resize', fitTests);

    // a card and its arrow light up together, on hover, focus or a click that pins it
    let pin = null, hov = null;
    const ids = (v) => String(v || '').split(' ').filter(Boolean);
    const mark = () => {
      const on = ids(hov || pin), pinned = ids(pin);
      const hit = tests.filter((x) => on.includes(x.id));
      lay.classList.toggle('thot', hit.length > 0);
      $$('[data-t]', lay).forEach((el) => el.classList.toggle('hot', ids(el.dataset.t).some((x) => on.includes(x))));
      $$('.tnode', lay).forEach((n) => n.classList.toggle('hot', hit.some((t) => n.dataset.story === t.later || n.dataset.story === t.earlier)));
      $$('.tcard', lay).forEach((c) => c.classList.toggle('pin', pinned.includes(c.dataset.t)));
    };
    const toggle = (id) => { pin = pin === id ? null : id; mark(); };
    pinTest = (id) => { pin = id; mark(); };
    redrawTests = () => { W = draw(); laidW = 0; fitTests(); mark(); paint(); fitLabels(); };
    // on touch only a tap counts: it pins the card and lights its arrow, a second tap lets go
    lay.addEventListener('mouseover', (e) => { if (touch) return; const el = e.target.closest('[data-t]'); const v = el ? el.dataset.t : null; if (v !== hov) { hov = v; mark(); } });
    lay.addEventListener('mouseleave', () => { hov = null; mark(); });
    lay.addEventListener('focusin', (e) => { if (touch) return; const el = e.target.closest('.tcard'); hov = el ? el.dataset.t : null; mark(); });
    lay.addEventListener('focusout', () => { hov = null; mark(); });
    lay.addEventListener('click', (e) => {
      if (e.target.closest('[data-story]')) return; // a story name or box opens the story
      const el = e.target.closest('[data-t]');
      if (!el) return;
      e.stopPropagation(); // an arrow pins its test card instead of opening the story
      toggle(el.dataset.t);
      if (pin && el.matches('.tedge')) { const c = $(`.tcard[data-t="${ids(pin)[0]}"]`, lay); if (c) c.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
    });
    lay.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.tcard')) { e.preventDefault(); toggle(e.target.dataset.t); } });
  }
  if (tests.length) renderTests(); else $('#sec-tests').remove();
  // a link in a slice to a test card pins that card
  document.addEventListener('click', (e) => { const a = e.target.closest('a[data-pin]'); if (a && pinTest) pinTest(a.dataset.pin); });

  fitLabels();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
    if (LC) { renderFlow(); paint(); }
    if (redrawTests) redrawTests();
    fitLabels();
    fitNames(document);
  });

  /* ---------- out of scope: one compact row ---------- */
  const scope = (D.outOfScope || []).filter((i) => i && i.text);
  if (scope.length) $('#scope').innerHTML = scope.map((i) => `<li${i.tip ? ' tabindex="0" ' + tipAttr(esc(i.tip)) : ''}>${esc(i.text)}</li>`).join('');
  else $('#scope-row').remove();

  /* ---------- side panel ---------- */
  const drawer = $('#drawer');
  const ICON = {
    prev: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg>',
    next: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg>',
    close: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  };
  const sec = (title, body, first) => `<section class="dr-sec${first ? ' first' : ''}">${title ? `<h4 class="dr-h">${title}</h4>` : ''}${body}</section>`;
  const userStory = (s) => {
    const u = s.story;
    if (!u || !(u.asA || u.iWant || u.soThat)) return '';
    return sec('', `<p class="us"><b>${esc(MD('asA'))}</b> ${esc(u.asA)}, <b>${esc(MD('iWant'))}</b> ${esc(u.iWant)}, <b>${esc(MD('soThat'))}</b> ${esc(u.soThat)}</p>`, true);
  };
  const why = (s, first) => (s.why ? sec(window.TdText.t('md.why'), `<p class="why">${esc(s.why)}</p>`, first) : '');
  const criteria = (s, first) => {
    const list = (s.criteria || []).filter(Boolean);
    if (!list.length) return '';
    return sec(esc(MD('criteria')), `<ol class="acs">${list.map((c) =>
      `<li class="gwt"><span class="k k-g">${esc(MD('given'))}</span> ${esc(c.given)} <span class="k k-w">${esc(MD('when'))}</span> ${esc(c.when)} <span class="k k-d">${esc(MD('then'))}</span> ${esc(c.then)}</li>`).join('')}</ol>`, first);
  };
  const codeBlock = (s) => {
    const code = s.code || [];
    if (!code.length && !s.testFiles) return '';
    const mods = [...new Set(code.map((c) => c.module))];
    // the words and colours of the slices: new or changes
    let h = mods.map((m) => `<div class="code-mod"><p class="code-m">${esc(m)}</p><ul class="code-list">${code.filter((c) => c.module === m).map((c) => {
      const kind = c.kind === 'new' ? 'new' : 'changes';
      const [word, why] = kind === 'new' ? [CELL.new || '', CELL.newTip] : [CELL.changes || '', CELL.changesTip];
      return `<li class="code-item" tabindex="0" ${tipAttr(`<b>${esc(word)}</b>${why ? ': ' + esc(why) : ''}<br><span class="muted">${esc(c.path)}</span>`)}><span class="cname">${esc(c.name)}</span><span class="kind ${kind}">${esc(word)}</span></li>`;
    }).join('')}</ul></div>`).join('');
    if (s.testFiles) h += `<p class="code-more">+ ${esc(TT(s.testFiles > 1 ? 'testFiles' : 'testFile', { n: s.testFiles }))}</p>`;
    return sec(esc(TT('code')), h);
  };
  const entry = (other, line, hit) => `<li class="ent${hit ? ' hit' : ''}">
      <button class="ent-chip" data-switch="${esc(other)}" ${tipAttr(storyTip(other))}><span class="badge sm">${num(other)}</span>${esc(shortOf(other))}</button>
      <p class="ent-line">${esc(line)}</p></li>`;
  const integration = (s, hit) => {
    const up = tests.filter((t) => t.later === s.id).sort((a, b) => idx.get(a.earlier) - idx.get(b.earlier));
    const down = tests.filter((t) => t.earlier === s.id).sort((a, b) => idx.get(a.later) - idx.get(b.later));
    if (!up.length && !down.length) return '';
    let h = '';
    if (up.length) h += `<div class="int-g"><p class="int-h">${esc(TT('buildsOnHead'))}</p><ul class="ents">${up.map((t) => entry(t.earlier, t.full, hit === t.earlier)).join('')}</ul></div>`;
    if (down.length) h += `<div class="int-g"><p class="int-h">${esc(TT('basisFor'))}</p><ul class="ents">${down.map((t) => entry(t.later, t.full, false)).join('')}</ul></div>`;
    return sec(esc(TT('integration')), h);
  };
  // the test case sections are HTML the generator rendered from the test case file
  const testCases = (s) => {
    const list = (s.tests || []).filter(Boolean);
    if (!list.length) return '';
    return sec(esc(TT('testCases')), `<div class="tcs">${list.map((t) => {
      const result = t.twinResult ? ((LB.twinResult || {})[t.twinResult] || t.twinResult) : '';
      const cls = ['passed', 'failed'].includes(t.twinResult) ? ' ' + t.twinResult : '';
      const tag = result ? `<span class="twin${cls}"${t.twin ? ' ' + tipAttr(esc(t.twin)) : ''}>${esc(result)}</span>` : '';
      const body = (t.sections || []).map((x) => `${x.heading ? `<h5>${esc(x.heading)}</h5>` : ''}${x.html || ''}`).join('');
      return `<details class="tc"><summary><span class="tc-t">${esc(t.title || t.testId)}</span>${tag}</summary><div class="tc-b">${body}</div></details>`;
    }).join('')}</div>`);
  };
  function fillDrawer(id, hit) {
    const s = byId.get(id);
    const i = idx.get(id);
    const status = D.phase === 'construction' && s.status
      ? `<span class="st st-${esc(s.status)}"><i class="dot dot-${esc(s.status)}"></i>${esc(statusLabel(s.status))}</span>` : '';
    $('#dr-head').innerHTML = `<span class="badge lg on">${num(id)}</span>
      <div class="dr-t"><h3 id="dr-title">${esc(s.title)}</h3>${status}</div>
      <div class="dr-nav">
        <button class="ib" data-go="${i - 1}" aria-label="${esc(TT('prev'))}" title="${esc(TT('prevTitle'))}" ${i === 0 ? 'disabled' : ''}>${ICON.prev}</button>
        <button class="ib" data-go="${i + 1}" aria-label="${esc(TT('next'))}" title="${esc(TT('nextTitle'))}" ${i === order.length - 1 ? 'disabled' : ''}>${ICON.next}</button>
        <button class="ib close" data-close aria-label="${esc(TT('close'))}" title="${esc(TT('closeTitle'))}">${ICON.close}<span>${esc(TT('close'))}</span></button>
      </div>`;
    const us = userStory(s);
    $('#dr-body').innerHTML = us + why(s, !us) + criteria(s, !us && !s.why) + codeBlock(s) + integration(s, hit) + testCases(s);
    $('#dr-body').scrollTop = 0;
    if (hit) { const el = $('.ent.hit', drawer); if (el) el.scrollIntoView({ block: 'center' }); }
  }

  /* ---------- selection and highlight ---------- */
  let selected = null, preview = null, edgeHover = null;
  function paint() {
    const a = preview || selected;
    const flow = $('#flow');
    if (flow) {
      flow.classList.toggle('active', !!a);
      flow.classList.toggle('all', !!a && !!LC.wrap && LC.wrap.story === a);
      $$('.fnode', flow).forEach((n) => n.classList.toggle('on', !!a && n.dataset.stories.split(' ').includes(a)));
      $$('.nbadge', flow).forEach((b) => b.classList.toggle('on', b.dataset.story === a));
      $$('.fwrap', flow).forEach((w) => w.classList.toggle('on', w.dataset.story === a));
      $$('.ftl-step', flow).forEach((n) => n.classList.toggle('on', !!a && n.dataset.stories.split(' ').includes(a)));
      $$('.ftl-b, .ftl-wl', flow).forEach((b) => b.classList.toggle('on', b.dataset.story === a));
      $$('.ftl-frame', flow).forEach((w) => w.classList.toggle('on', w.dataset.wrap === a));
    }
    $$('.schip').forEach((c) => { c.classList.toggle('on', c.dataset.story === a); });
    const mx = $('#matrix');
    if (mx) {
      mx.classList.toggle('active', !!a);
      $$('[data-col]', mx).forEach((c) => c.classList.toggle('on', c.dataset.col === a));
    }
    const tg = $('#tests');
    if (tg) {
      // hovering one arrow shows only that test; otherwise every test of the active story
      const [hl, he] = edgeHover ? edgeHover.split('>') : [];
      const edgeOn = (e) => (edgeHover ? e.dataset.later === hl && e.dataset.earlier === he : e.dataset.later === a || e.dataset.earlier === a);
      const rel = new Set();
      $$('.tedge', tg).forEach((e) => { const on = !!(edgeHover || a) && edgeOn(e); e.classList.toggle('on', on); if (on) rel.add(e.dataset.later).add(e.dataset.earlier); });
      tg.classList.toggle('active', !!(edgeHover || a));
      $$('.tnode', tg).forEach((n) => {
        const id = n.dataset.story;
        n.classList.toggle('on', edgeHover ? id === hl : id === a);
        n.classList.toggle('rel', rel.has(id) && !n.classList.contains('on'));
      });
    }
  }
  function select(id, hit) {
    if (!id || !byId.has(id) || (selected === id && !hit)) { close(); return; }
    selected = id;
    fillDrawer(id, hit);
    drawer.classList.add('open');
    document.body.classList.add('sheet-open');
    paint();
    if (LC) { layoutFlow(); showLit(); }
  }
  function close() {
    selected = null;
    drawer.classList.remove('open');
    document.body.classList.remove('sheet-open');
    paint();
    if (LC) layoutFlow();
  }
  document.addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]');
    if (go) { const s = order[+go.dataset.go]; if (s) select(s.id); return; }
    if (e.target.closest('[data-close], .scrim')) { close(); return; }
    const sw = e.target.closest('[data-switch]');
    if (sw) { select(sw.dataset.switch); return; }
    const te = e.target.closest('.tedge');
    if (te) { select(te.dataset.later, te.dataset.earlier); return; }
    const el = e.target.closest('[data-story]');
    if (el && !el.closest('.drawer')) {
      if (el.classList.contains('fwrap') && !e.target.closest('.wl')) return;
      select(el.dataset.story);
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && selected) { close(); return; }
    const t = e.target instanceof Element ? e.target : document.body;
    if ((e.key === 'Enter' || e.key === ' ') && t.matches('g[role="button"][data-story]')) { e.preventDefault(); select(t.dataset.story); }
    if (selected && (e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !t.closest('input,textarea')) {
      const i = idx.get(selected) + (e.key === 'ArrowRight' ? 1 : -1);
      if (order[i]) select(order[i].id);
    }
  });
  document.addEventListener('mouseover', (e) => {
    if (touch) return; // a tap selects; the hover preview is for a mouse
    const el = e.target.closest('[data-hover]');
    const id = el ? el.dataset.story : null;
    const te = e.target.closest('.tedge');
    const eh = te ? te.dataset.later + '>' + te.dataset.earlier : null;
    if (id !== preview || eh !== edgeHover) { preview = id; edgeHover = eh; paint(); }
  });
  paint();
  fromHash();
  window.addEventListener('hashchange', fromHash);
})();
</script>
</body>
</html>
