<div class="app">
  <main class="stage pad">
    <section class="board" id="board" aria-labelledby="vtitle">
      <header class="board-head">
        <h2 class="vh" id="vtitle">{{tab}}</h2>
        <nav aria-label="{{path.label}}"><ol class="path" id="path"></ol></nav>
      </header>
      <div class="view">
        <div class="canvas" id="canvas"><p class="wait">{{drawing.wait}}</p></div>
        <p class="notice" id="notice" role="status" hidden></p>
        <div class="tools" role="toolbar" aria-label="{{tools.label}}">
          <button type="button" id="zout" aria-label="{{tools.smaller}}" title="{{tools.smallerTip}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <output id="zoomv" aria-live="polite">100%</output>
          <button type="button" id="zin" aria-label="{{tools.larger}}" title="{{tools.largerTip}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <span class="sep" aria-hidden="true"></span>
          <button type="button" id="zfit" aria-label="{{tools.fit}}" title="{{tools.fitTip}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3.5H5A1.5 1.5 0 0 0 3.5 5v3M20.5 8V5A1.5 1.5 0 0 0 19 3.5h-3M3.5 16v3A1.5 1.5 0 0 0 5 20.5h3M16 20.5h3a1.5 1.5 0 0 0 1.5-1.5v-3"/><rect x="8" y="8" width="8" height="8" rx="1.5"/></svg></button>
          <button type="button" id="zfull" aria-label="{{tools.full}}" aria-pressed="false" title="{{tools.full}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        </div>
      </div>
      <p class="vh" id="live" aria-live="polite"></p>
      <footer class="board-foot how">
        <div class="legend" id="legend" aria-label="{{legend.label}}"></div>
      </footer>
    </section>
    <div class="dock" id="dock">
      <div class="grip" id="grip" role="separator" aria-orientation="vertical" aria-controls="side" aria-label="{{side.width}}" tabindex="0"
        title="{{side.gripTip}}"></div>
      <div class="dock-card">
        <div class="dock-head">
          <button type="button" class="dock-fold" id="side-fold" aria-controls="side" aria-expanded="true" aria-label="{{side.fold}}" title="{{side.fold}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M14.5 4.5v15M7.5 9.5 10 12l-2.5 2.5"/></svg></button>
          <span class="dock-t" aria-hidden="true">{{side.title}}</span>
        </div>
        <aside class="side" id="side" aria-label="{{side.title}}"></aside>
        <button type="button" class="dock-open" id="side-open" aria-controls="side" aria-expanded="false" aria-label="{{side.open}}" title="{{side.open}}">
          <span class="dock-open-ic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M14.5 4.5v15M10 9.5 7.5 12l2.5 2.5"/></svg><span class="dock-dot" aria-hidden="true"></span></span>
          <span class="dock-open-t" aria-hidden="true">{{side.title}}</span>
        </button>
      </div>
    </div>
  </main>
</div>
